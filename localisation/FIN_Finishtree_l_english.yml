FIN_fokker_deal:0 "Fokker Deal"
FIN_fokker_deal_desc:0 "In 1937, the Finnish government decided to place an order for an initial batch of seven aircraft, further negotiations were also conducted towards the acquisition of a manufacturing license, under which Finland proceeded to domestically produce further aircraft as well. Between 1939 and 1944, the State Aircraft Factory manufactured a total of 93 aircraft."
FIN_valtion_lentokonetehdas:0 "Valtion lentokonetehdas"
FIN_valtion_lentokonetehdas_desc:0 "Valtion lentokonetehdas (State aircraft factory) was a Finnish aircraft manufacturing company that was founded on 23 February 1928 from the I.V.L. factory."
FIN_tampere_airfract_factory:0 "Tampere Airfract Factory"
FIN_tampere_airfract_factory_desc:0 "In the 1930s the Valtion lentokonetehdas factory was moved to Tampere from where it continued aircraft production."
