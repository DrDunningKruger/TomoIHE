FIN_activate_lotta_svrd:0 "Lotta Svärd"
FIN_activate_lotta_svrd_desc:0 "During the Winter War some 100,000 men whose jobs were taken over by "Lottas" were freed for military service. The Lottas worked in hospitals, at air-raid warning posts and other auxiliary tasks in conjunction with the armed forces."
