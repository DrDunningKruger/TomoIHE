 #### Airborne tank module ####
 tank_light_one_man_tank_turret_p:0 "Airborne Tank Turret"
 tank_light_one_man_tank_turret_p_desc:0 "A small turret barely large enough to hold a single crew member, who is tasked with aiming and loading the main armament as well as keeping watch for targets and threats."
 tank_auto_cannon_2_p:0 "Airborne Tank Automatic Cannon"
 tank_auto_cannon_2_p_desc:0 "Adapted from a fast-firing anti-air gun, this automatic cannon can lay down a hail of fire that is devastating to soft targets. The small caliber does limit its anti-armor performance."
 tank_small_cannon_2_p:0 "Airborne Tank Small Cannon"
 tank_small_cannon_2_p_desc:0 "A small and cheap cannon, able to fire both anti-infantry and anti-armor rounds. Its small caliber limits its usefulness"
 tank_high_velocity_cannon_p:0 "Airborne Tank High-Velocity Cannon"
 tank_high_velocity_cannon_p_desc:0 "A cannon specifically designed to achieve a high muzzle velocity. Using specialized ammunition, it has superb anti-armor characteristics, but its performance against soft targets suffers."