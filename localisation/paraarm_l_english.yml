 ##### Airborne tank battalion ###
 light_para_armor:0 "Airborne Tank"
 light_para_armor_desc:0 "Airborne Tank or Airborne Assault Vehicle(AAVs) is a small light tank that designed to be transported by glider and support paratroopers."
 
