tutorial.31.t:0 "IH&E Mexico"
tutorial.32:0 "IH&E Brazil"
tutorial.32.t:0 "IH&E Brazil"
tutorial.32.d:0 "- Can lend lease Allies after France falls.\n\n- Can’t join the Allies and their war before United States.\n\n- Can't send divisions or air wings to Soviet Union."
tutorial.32.a:0 "Sim!"
tutorial.33:0 "IH&E USA"
tutorial.33.t:0 "IH&E United States"
tutorial.33.d:0 "- Can join the Allies but not the war after the fall of France.\n\n- Can join the war if UK loses a mainland port or after 1.1.1941.\n\n- Can't lend lease anything but Fuel to the Allies until France falls.\n\n- Depression and Senate fully scripted.\n\n- Prepositioning troops is allowed and you should do it.\n\n- You can do decision "Operation Torch" after 1941, giving neutral French North Africa to Italy so you can invade it."
tutorial.33.a:0 "Yeah!"
tutorial.34:0 "IH&E Siam"
tutorial.34.t:0 "IH&E Siam"
tutorial.34.d:0 "Have fun!"
tutorial.34.a:0 ":)"
