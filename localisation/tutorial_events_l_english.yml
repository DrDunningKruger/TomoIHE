tutorial.1:0 "Global Ruleset ( applies to everyone )"
tutorial.1.t:0 "Global Ruleset"
tutorial.1.d:0 "§OEconomy:\n§b- Total Mobilization before Barbarossa is prohibited, except for Japan.\n- Allies and Comintern can switch to Total Mobilization if there is no Barbarossa before 1942.\n- No deleting factories. Your own dockyards can be deleted if you are out of building slots.\n- There is no boost limit. (USSR cannot be boosted)\n\n§BAir Combat:\n§b- Minimum air wing size is 100.\n- Can’t switch air zones multiple times in under 20 seconds.\n- Can't use neutral airfields.\n- Ace grinding is disabled.\n\n§TNaval Combat:\n§b- No overstacking carriers. Max number of carriers per fleet is 8.\n- Carrier Planes in naval battles have 1/3 lower sortie rates than vanilla.\n- Weather in Naval Zones removed\n- Fleets cannot be given “Do Not Engage” orders.\n- Subs can only be put on convoy raiding at medium risk.\n- Min 5, max 20 subs per task force.\n- 1940 Subs are same as 1936 ones, except they have greater range and an extra module slot\n- You can only have docking rights from countries in your faction + USSR for Allies."
tutorial.1.a:0 "Ok, next?"
tutorial.2.d:0 "§GLand Combat:\n§b- Allies can’t have divisions or air wings in Soviet Union.\n- Only Belgium and Netherlands are allowed to have divisions in France before it capitulates.\n- Allies can't have divisions in Poland.\n- No para dropping or bombing Spain.\n- No Sealion until 41, Axis must control both Gibraltar and Suez.\n- No deploying divisions in a tile where you are currently losing combat.\n\n- Minimum division combat width is 20 for combat divisions.\n- Paratroopers can be 10w, have to be full equipped.\n- No Space marines. ( Infantry / Special forces combined with Tanks )\n- No disbanding / changing templates of encircled, nearly encircled and convoy raided divisions.\n\n- Axis and Co-Prosperity Sphere countries can’t lend lease Allies or Comintern and vice versa.\n- Allies can’t lend lease Comintern and Comintern can’t lend lease Allies before Barbarossa.\n- Comintern can't lend lease Allies their light tanks or planes."    
tutorial.2.a:0 "Understood"
tutorial.3:0 "What Mod Do?"
tutoria3.1.t:0 "IH&E Features:"
tutorial.3.d:0 "One of the oldest historical multiplayer mods, still actively played and developed, the IH&E is the definitive 12kph motorized-mediums experience. If you like fast-paced microing this is the mod for you.\n\n-If you don't like the custom map, use the Big Mike edition instead. You can run it regardless of which IH&E version host uses.\n\n-The following redundant and tedious mechanics have been entirely removed: MIOs, Arms Market, Resistance, Spy Agencies, Terrain-Based Combat Width, Trait Grinding, Ace Grinding."
tutorial.3.a:0 "Understood"
tutorial.4:0 "IH&E Features:"
tutorial.4.d:0 "- Optimized and fast experience. Useless nations have been done away with entirely.\n\n- No Asia preset (rule), allowing you to start with as little as 8 players and still have a full game.\n\n- No Spanish Civil War or China War, removed and scripted for the sake of game speed.\n\n- Rebalanced Armor and Plane designer, with all modules being researchable via their respective tech trees.\n\n- Plenty of fun micro-mechanics and a viable Endsieg. Barb is dynamic, with Axis having bonuses in summer, and Soviets in winter.\n\n- Three starting research slots for all minors\n\n- Brazil, Belgium, Norway, Nepal, Cuba, Greece, Philippines, Italian East Africa, Siam, Finland, Yugoslavia (Croatia), and Mongolia are all playable with unique focus trees.\n\n- Tanks are very fast, river crossing penalty is low, forts can't be built. Micro!"
tutorial.5:0 "General Info:"
tutorial.5.d:0 "- Heavies are stronger but not cost-effective. Majors should do 12kph medium tanks.\n\n- Mech is cheaper but pretty bad. Do motorized 10t-9m-2aa.\n\n - Planes have double the IC and 1944 airframes are date-locked to 1942. You will build the 1940 Fighter for most of the game.\n\n- Conscription laws rebalanced. Early ones got a slight buff, late ones got a nerf.\n\n- IH&E features 'country booster' decisions, allowing you to spend your pp late game on small buffs.\n\n- 2x 100% industry bonus for all countries in the game (decision).\n\n- All generals and admirals are preset.\n\n- Templates are free and the combat width is returned to pre-NSB (40w).\n\n- There is no special forces cap, but they do cost twice as many guns.\n\n- Two new SF infantry types: Jagers (forests and swamps) and Mot. Desert Infantry (deserts and hills).\n\n- Motorized Paratroopers and Paradropable Artillery added.\n\n- Light Tank 4, Paradropable Light Tank, Medium Naval Bomber and Medium CAS have all been added."
tutorial.6:0 "General Info"
tutorial.6.d:0 "§RComintern:§!\n- Soviets are locked in a closed economy and their factories auto-evacuate to Siberia when Barbarossa starts.\n- Soviets should do no air, and prepare defenses in depth. Germans have to cross the Urals to cap them.\n- AI Finland doesn't join the war. Mongolia can be used as an Aircon or a tank minor but counts as a Soviet coop.\n\n§BAllies:§!\n- UK is the main air producer and aircon. Air alone isn't great against Subs, use it in combination with ASW DDs.\n- If Allies lose Africa, Invasion of Iraq and Operation Torch, especially when timed together, can be used to re-take it.\n- As UK you should ignore minors when they ask for tradebacks.\n- In No-Asia, UK starts with more guns, and an extra research slot if it chooses to play without Australia.\n- France gets increasingly harsh debuffs over time. After it capitulates, debuffs become tank IC buffs.\n- SAF and Canada should probably do tanks.\n\n§GAxis§!\n-Germany is the main air producer and aircon, but you can force aircon duties on Hungary or Bulgaria if you so wish.\n- Italy does the DDay wall. Yell at him to build guns and crank out divs before Barb\n-Italy is supposed to enter the war via Greece focus. If it doesn't enter the war within 2 months of France falling, it will join automatically.\n- Axis, besides Italy, have -33% stats in North Africa for the first two months of the war. Don't let Allies push you out!\n- Axis have -33% stats in sub-Saharan Africa. Safari at your own risk.\n- Yugoslavia becomes Croatia after the fall of France via German focus. If its not a plyer, it can be annexed by Italy.\n- Spain joins the war but can't be invaded or bombed. It should do tanks\n- Romania should do special forces and lend-lease fuel\n\n§0Copro§!\n- China War is scripted. Do those focuses as soon as they are available to get your industry.\n- Join war at the start of 41."
tutorial.7:0 "IH&E Germany"
tutorial.7.t:0 "IH&E Germany"
tutorial.7.d:0 "- Two new focuses improving equipment production capability for a year: "Battle of Britain" and "Incorporate Bohemian Tank Industry".\n- Coal Liquidization gives useful amount of Refineries.\n- You can do both "Integrate War Economies" and "German War Economy".\n- "Anschluss" focus gives you an extra research slot.\n- "Air Innovations" focus also gives you light airframe research bonus, you shoul probably do it early and produce most of your own air.\n- If you think you are gonna get you ass kicked this game do the arctic base focus before war for a funny before you cap.\n\n- Don't be in Africa until Italy joins the war.\n\n- Annexation of AUS/CZE/DEN/LUX is scripted.\n- Do "Strike South" focus to turn Yugo into Croatia after France has fallen and Italy has invaded Greece.\n\nAlso read main ruleset!"
tutorial7.1.a:0 "Jawohl!"
tutorial.8:0 "IH&E Italy"
tutorial.8.t:0 "IH&E Italy"
tutorial.8.d:0 "- Italian East Africa is a playable country.\nIf it's a player you can respawn him as Albania once he capitulates.\n\n- You have a stronger starting industry compared to vanilla but can't invade Yugoslavia before WW2.\n- To invade Yugoslavia you first have to invade Greece (available after France falls), and then Germany has a focus to invade it.\n\n- You have new "Naval War Games" and "Build-up Libya" focuses.\n\n- You can get Cruiser Subs from "Sea Wolves" focus.\n\n- "Pact of Steel" focus gives you Expanded Conscription idea ( 3% recruitable pop ).\n\n- "Trimuph in Africa" focus gives you an extra research slot.\n\n- If you take over Egypt Allies can open up a new front in Africa by annexing the territory of Iraq, you will be notified few days before this happens by an event.\n\n- When France capitulates French North Africa becomes neutral territory until USA does the Operation Torch, which is when the territory becoems yours. You will be notified few days before this happens by an event.\n\n- Can join the war 6 months after Germany declares war on Poland, or after the “fall of France”\n- Must join within 2 months after fall of France"
tutorial.8.a:0 "Sì!"
tutorial.9:0 "IH&E Italian East Africa"
tutorial.9.t:0 "IH&E Italian East Africa"
tutorial.9.d:0 "- You can become Italian East Albania once you die. Italy has decisions to give you Kosovo and Montenegro as well. You get cores on all territories you get from Italy."
tutorial.10:0 "IH&E Romania"
tutorial.10.t:0 "IH&E Romania"
tutorial.10.d:0 "- Stay out of Africa until Italy joined the war.\n\n- "Force Abdication" focus turns you fascist.\n\n- Marine focus moved from naval to army tree.\n\n- The Armored Division focus gives a fully equipped 10-10 medium tank division.\n\n- Romanian divisions are not using fuel, so now you can go closed eco and lend-lease 100% of your fuel away. However if you want your tank/mech/motorized units to have fuel, DO NOT convert regular divisions or edit their templates to have battalions that consume fuel. Train them from the scratch instead."
tutorial.10.a:0 "Da!" 
tutorial.11:0 "IH&E Hungary"
tutorial.11.t:0 "IH&E Hungary"
tutorial.11.d:0 "- Stay out of Africa until Italy joined the war.\n\n- "Renounce the Treaty of Trianon" focus turns you fascist.\n\n- In case you are an aircon, Ace grinding is disabled."
tutorial.11.a:0 "Igen!"
tutorial.12:0 "IH&E Bulgaria"
tutorial.12.t:0 "IH&E Bulgaria"
tutorial.12.d:0 "- Stay out of Africa until Italy joined the war.\n\n- Obv you have a slightly different tree compared to vanilla, look into it.\n\n- You can become a puppet of the Germany through Form a Regency Council focus."
tutorial.12.a:0 "Da!"
tutorial.13:0 "IH&E Spain"
tutorial.13.t:0 "IH&E Spain"
tutorial.13.d:0 "- Spain in IH&E is meant to be played like a volunteer only country, except it joins a war so it can be convoy raided, affect supply, get lend-leased and so on...\n\n- You have no coastal provinces or land borders so you can't be invaded, no need for garrisons.\n\n- Province in Galicia is connected to Berlin, that's how you can get your divisions out of your country.\n\n- You have a decision to buy fuel. Amount of fuel you get from it depends on your fuel refining tech level."
tutorial.13.a:0 "Si!"
tutorial.14:0 "IH&E Finland"
tutorial.14.t:0 "IH&E Finland"
tutorial.14.d:0 "- Winter war is scripted, you can only start the Continuation war once Germany invades Soviet Union\n- Soviet Union can invade you in late 41 if there is no Barbarossa\n\n- Once you do the Winter War focus you have a limited time to do aid, anti air and total mob focuses.\n- If you miss any of those focuses you can do them during continuation war\n\n- You have stat bonus in your cores, and debuff outside of them.\n\n- Can't join Axis or any war other than Continuation war"
tutorial.14.a:0 "Joo!"
tutorial.15:0 "IH&E UK"
tutorial.15.t:0 "IH&E UK"
tutorial.15.d:0 "- Sealion is allowed after 1941, if Axis control both Gibraltar and Suez.\n\n- Don't invite or accept Belgium, Netherlands, Norway or Greece to faction until they get declared on. Norway can join it via event in Mar, 1940.\n\n- You got 40 extra starting submarines 1s.\n\n- Air Rearmament gives you free Fighter 2s.\n\n- When Barb starts you can do "Secure Iran" focus to allow Soviets to do Lend-lease focuses.\n\n- If you lose Egypt to the Axis you can do "Secure Iraq" focus, giving you a new front to take the Africa back.\n\n- You cannot build up planning bonuses for naval invasions on Gibraltar or Ireland until you complete "Irish Negotiations" focus after 1942.\n\n- "BSA Company" focus gives you artillery bonus. If playing NoAsia without Australia focus also gives research bonuses for last AT tech."
tutorial.15.a:0 "Yes!"
tutorial.16:0 "IH&E France"
tutorial.16.t:0 "IH&E France"
tutorial.16.d:0 "- Must join the war when it starts.\n\n- Can't move divisions into Belgium or Netherlands until both you and them are at war\n\n- Can't build ports in mainland France until you capitulate\n\n- French North Africa becomes neutral once you cap. It becomes Italian when USA does the "Operation Torch" decision.\n\n- All the Civs and Mils from develop colonies and Popular Front focuses are off map so you won't lose them."
tutorial.16.a:0 "Oui!"
tutorial.17:0 "IH&E Belgium"
tutorial.17.t:0 "IH&E Belgium"
tutorial.17.d:0 "- Can’t lend lease Allies until you are in the same faction.\n\n- Must join the Allies when Germany declares war.\n\n- Cannot have divisions in the Allied territory or have Allied divisions in your territory until you join the Allies"
tutorial.17.a:0 "Ja!"
tutorial.18:0 "IH&E Netherlands"
tutorial.18.t:0 "IH&E Netherlands"
tutorial.18.d:0 "- Playable only if Asia preset and Axis/Copro have their minors.\n\n- Can’t lend lease Allies until you are in the same faction.\n\n- Must join the Allies when Germany declares war on you.\n\n- Cannot have divisions in the Allied territory or have Allied divisions in your territory until you join the Allies."
tutorial.19:0 "IH&E Greece"
tutorial.19.t:0 "IH&E Greece"
tutorial.19.d:0 "- You get Crete once you capitulate.\n\n- Can’t lend lease Allies until you are in the same faction.\n\n- Must join the Allies when Germany declares war.\n\n- Cannot have divisions in the Allied territory or Allied divisions in your territory until you join the Allies."
tutorial.19.a:0 "Yes! (in Greek)"
tutorial.20:0 "IH&E Norway"
tutorial.20.t:0 "IH&E Norway"
tutorial.20.d:0 "- Don't delete your divisions, you will not be able to train new ones.\n\n- Do your best to defend southern towns for the first days of the war, If Axis get them you will capitulate.\n\n- Can’t lend lease Allies until you are in the same faction.\n\n- Must join the Allies when Germany declares war.\n\n- Cannot have divisions in the Allied territory or Allied divisions in your territory until you join the Allies."
tutorial.20.a: "Ja!"
tutorial.21:0 "IH&E Poland"
tutorial.21.t:0 "IH&E Poland"
tutorial.21.d:0 "- Your indistry and prewar army have been scripted, your game basically starts post capitulation.\n\n- Choose between Playing as Poland in the West and Poland in the East."
tutorial.21.a:0 "Tak!"
tutorial.22:0 "IH&E USSR"
tutorial.22.t:0 "IH&E USSR"
tutorial.22.d:0 "- Do purge before 1939 to avoid debuffs.\n\n- Can't declare war on Japan until 43 and vice versa.\n\n- Can't declare on Germany until 42.\n\n- Cannot lend-lease to or accept lend-lease from the Allies until Barbarossa.\n- Cannot lend lease Allies planes or light tanks.\n\n- Can’t disband faction and join Allies. ( bruh )\n\n- Can't send 700 bombers as air volunteers to Allies and bomb Germany.\n- Can't send 600 and bomb Hungary either.\n- Just don't bomb or dogfight Axis with air volunteers before Barb ok?\n\n- "Found the PCDI" focus gives you an extra research slot."
tutorial.22.a:0 "Da!"
tutorial.23:0 "IH&E Mongolia"
tutorial.23.t:0 "IH&E Mongolia"
tutorial.23.d:0 "- You can send air volunteers to Allies if you wanna watch the war, but can't send any planes to their airfields."
tutorial.23.a:0 "Da! (in Mongolian)"
tutorial.24:0 "IH&E Nepal"
tutorial.24.t:0 "IH&E Nepal"
tutorial.24.d:0 "- Can go independent but not leave Allies.\n\n- Not allowed to send divisions to France or Poland before they capitulate.\n\n- Can't send divisions or air wings to Soviet Union."
tutorial.24.a:0 "Alright!"
