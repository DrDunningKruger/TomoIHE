tutorial.36:0 "IH&E Japan"
tutorial.36.a:0 "はい"
tutorial.36.t:0 "IH&E Japan"
tutorial.36.d:0 "- Must be in your own faction.\n\n- There is no China war,instead new "China" focus is available every 210 days.\n\n- Can declare war on Allies after 1.1.1941.\n\n- Can be justified on by the Allies after mid 1941.\n\n- Can declare war on Comintern after 1.1.1943 and vice versa.\n- Has to do a border conflict against USSR to be able to declare war on it.\n\n- Can use Kamikaze only in the Kamikaze zone."
tutorial.37:0 "IH&E Croatia"
tutorial.37.t:0 "IH&E Croatia"
tutorial.37.a:0 "Da!"
tutorial.37.d:0 "- Stay out of Africa until Italy joined the war.\n\n- Don't join the war until Germany turns you into Croatia."
