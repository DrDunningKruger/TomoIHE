  HUN_revision_by_diplomacy:0 "Revision by Diplomacy"
 HUN_revision_by_diplomacy_desc:0 "Recovery of our lost territories is paramount, but it can't be achieved by force alone. We shall exploit every diplomatic avenue before resorting to violence. This way we may keep our country from falling to radical ideologies, while still achieving the desired territorial restitution."
 HUN_home_defense_focus:0 "Home Defense"
 HUN_home_defense_focus_desc:0 "Whatever course we take, it never hurts to prepare for the worst. We need to defend our country, and let our people know that they can feel safe here. Budapest is not only our capital, but also a strategically important crossing over the Danube, which needs to be appropriately defended. We should start the fortification of the country there."
 HUN_the_great_coalition:0 "The Great Coalition"
 HUN_the_great_coalition_desc:0 "In these turbulent times, our best bet is to try to stay neutral, and keep the country stable. To do this, we will need a strong government, that can pass the necessary reforms unopposed. The Bethlen-Peyer-pact of 1921 laid the fundations of this cooperation, but we will need to see it to its completion. The NEP, the SZDP and the FKgP need to form a coalition to stabilize the country."
 HUN_seek_allied_support_for_revision:0 "Seek Allied Support for Revision"
 HUN_seek_allied_support_for_revision_desc:0 "The time has come to give up our neutrality. The Allies' war with Germany provides an ideal opportunity to achieve a review of the Trianon peace dictatorships in return for our help. We must not miss this opportunity. "
 HUN_submit_to_the_kaiser:0 "Submit to the Kaiser"
 HUN_submit_to_the_kaiser_desc:0 "In Germany, the emperor came to power again. With a possible imperial help, we can easily recover our lost territories. But the emperor will probably charge a very high price for this."
 HUN_armed_neutrality:0 "Armed Neutrality" 
 HUN_armed_neutrality_desc:0 "We will want to stay neutral in the coming conflicts, if possible. To deter any attackers, we will bolster our defenses, and build up our army as best we can."
 HUN_renegotiation_of_trade_agreements:0 "Renegotiation of Trade Agreements"
 HUN_renegotiation_of_trade_agreements_desc:0 "By renegotiating the existing trade agreements, we can ensure the supply of raw materials in Hungary and provide a more favorable market for our own products in the German and Italian markets."
 HUN_market_diversification:0 "Market Diversification"
 HUN_market_diversification_desc:0 "By opening up to new markets, we can reduce Hungary's unilateral economic dependence on Germany and Italy. In this way, we can also provide better export opportunities for our own products."
 HUN_womens_suffrage:0 "Women's Suffrage"
 HUN_womens_suffrage_desc:0 "Though women in our country can already vote, the restrictions set on them are harsher than those on men. We need to abolish these inequalities, and ensure that most of the adult population of our nation is able to vote."
 HUN_women_in_the_army:0 "Women In The Army"
 HUN_women_in_the_army_desc:0 "Our country is small, and if we want to be able to defend it, we will need every resource available. By restricting conscription to men only, we are not only putting yet another restriction on women, we are also missing out on potential recruits. Though the decision may upset some of the more conservative officers, we must allow women in the army for the good of the country."
 HUN_social_reconciliation:0 "Social Reconciliation"
 HUN_social_reconciliation_desc:0 "The coalition government is the strongest leadership we have had in the past decades. We must ensure its longevity and stability, and cannot let past differences stand in the way of this. We will see past former party affiliations, and consolidate the power of the government, in the pursuit of national unity."
 HUN_autonomous_minorities:0 "Autonomus Minorities"
 HUN_autonomous_minorities_desc:0 "By guaranteeing the rights of the large number of minorities living in the recaptured areas, we can contribute to the stability of the country and prevent another catastrophe like Trianon."
 HUN_tax_reform:0 "Tax Reform"
 HUN_tax_reform_desc:0 "The war caused immense suffering to many in our nation, but there are those, who got rich during the conflict, and rose above in the ranks of society after the war. This has created greater inequality in the country, which we could resolve by sorting the newly wealthy classes into a different tax bracket, so that they have to contribute more."
 HUN_education_reform:0 "Education Reform"
 HUN_education_reform_desc:0 "One of the main driving forces behind the economical, and military efforts of a nation, is the intellectual base of its population. We have to do our best to preserve, and improve the education system of Hungary, so that we don't fall behind others."
 HUN_align_with_the_victors:0 "Align With The Victors"
 HUN_align_with_the_victors_desc:0 "Clearly, aligning ourselves to the germans has not been the right decision, as it was proven in the Great War. To ensure that we are never on the losing side again, we have to embrace the liberal and democratic ideas of the victors, in hope of gaining their support and protection."
 HUN_secure_the_new_government:0 "Secure The New Government"
 HUN_secure_the_new_government_desc:0 "The government has gone through rapid changes, thanks to our efforts to install a democratic, liberal leadership in the country. The nation needs to recover from these changes, and some time is needed to consolidate the power of the new government."
 HUN_pass_the_preparation_act:0 "Pass The Preparation Act"
 HUN_pass_the_preparation_act_desc:0 "War in Europe seems inevitable. We can try to stay out of it, but we must prepare for any eventuality, including an invasion of Hungary. Every precaution shall be made to ensure the best possible circumstances for our armed forces, if it comes to defending our homeland. The streets, the buildings, the hills, the rivers will all serve as defensive positions if it comes to the worst."
 HUN_convertible_factories:0 "Convertible Factories"
 HUN_convertible_factories_desc:0 "In preparation for a possible conflict, we have to make our factories easier to adapt to arms production. Why could food cans not have the same diameter, as hand grenades?"
 HUN_emergency_measures:0 "Emergency Measures"
 HUN_emergency_measures_desc:0 "War is upon us, which means our economy and industry has to go through drastic changes. Consumers will have to cut back on their consumption, for the good of the nation, if we want to maintain a competetive war industry."
 HUN_strengthen_the_move:0 "Strengthen the MOVE"
 HUN_strengthen_the_move_desc:0 "The MOVE is a paramilitary organization, founded in part by Bajcsy-Zsilinszky, the purpose of which was to support the army, that was crippled by the restrictions set at Trianon. The group faded into relative obscurity over time, but it could be repopularized to boost national morale, and prepare the population for defending the country, if necessary."
 HUN_land_reform:0 "Land Reform"
 HUN_land_reform_desc:0 "Many of the farmlands in Hungary still have disputed ownership since the country shrank in size, and crown lands were redistributed. A thorough reform of land ownership laws would ensure, that these lands end up in the right hands, and some smallholders could finally start their own ventures."
 HUN_espirit_de_corps:0 "Espirit De Corps"
 HUN_espirit_de_corps_desc:0 "The army is in desperate need of a shakeup. Many officers and generals have been previously associated with communist or fascist groups. These people will have to be replaced by leaders that have the intersts of Hungary at heart."
 HUN_leaning_westward:0 "Leaning Westward"
 HUN_leaning_westward_desc:0 "With a democratic government, we should seek out democratic friends, as we are too small to succeed in the world on our own. The most obvious choices lie to the west, so that is where we will start."
 HUN_joining_the_right_cause:0 "Joining The Right Cause"
 HUN_joining_the_right_cause_desc:0 "A stable, peaceful world is built on the solid foundation of democracy. There are those who would see this foundation destroyed, and replace it with cruel dictatorship, or unreasanoble ideology. We must take a stand against these threats, may they be fascists in Germany, or communists in the Soviet Union. The future of Hungary lies with the Allies."
 HUN_uk_license_trade:0 "UK License Trade"
 HUN_uk_license_trade_desc:0 "The English are more advanced technologically than us. If we want to be of any help to them, we have to convice them to share some of their licenses with us, so that we can keep up in this fast-developing world."
 HUN_british_scientific_exchange:0 "British Scientific Exchange"
 HUN_british_scientific_exchange_desc:0 "Our common intersts dictate, that we share everything we know with our allies. The British have agreed to start a scientific exchange, so we can learn from each other's technological advancements."
 HUN_the_danubian_coalition:0 "The Danubian Coalition"
 HUN_the_danubian_coalition_desc:0 "Now that we have established ourselves, as a beacon of democracy in the area, we should try to rally others behind our cause. We shall hold a conference, with all surrounding countries invited, at which a local alliance will be proposed. If nations all along the river Danube, and beyond would join this cause, together we could stand up to any of the threats facing the region."
 HUN_democratic_trade_focus:0 "Democratic Trade Focus"
 HUN_democratic_trade_focus_desc:0 "We can't just trade with anyone. We have to ensure, that our trading partners are aiding the right cause, and not dealing with the devil and his kind. Before we proceed with any trade deal, a comittee will inspect the trading history of the country, and if they are found to have helped undemocratic causes, the deal is off."
 HUN_scientific_spirit:0 "Scientific Spirit"
 HUN_scientific_spirit_desc:0 "We may not have the numbers that the fascists have, but we may be able to make that up in technology. With close cooperation between our scientists, and the Allies', we can make breakthroughs earlier than alone, and perhaps even outmatch the fascists' efforts."
 HUN_ask_for_szekler_autonomy:0 "Ask For Szekler Autonomy"
 HUN_ask_for_szekler_autonomy_desc:0 "The loss of Transylvania has left more than a million Hungarians outside of our borders. The largest community affected by this is that of the Szeklers, who have been begging the Romanians for some scrap of autonomy, ever since Trianon. Perhaps if we brought our influence to bear, Romania might be willing to grant them their wish."
 HUN_peace_with_our_neighbors:0 "Peace With Our Neighbors"
 HUN_peace_with_our_neighbors_desc:0 "We can't secure our position as a strong democratic country, if we are surrounded by old enemies. It is time to reconcile with our neighbors, and work towards cooperation in the area. Perhaps our former enemies will become our new friends in the conflicts to come."
 HUN_referendum_for_southern_slovakia:0 "Referendum For Southern Slovakia"
 HUN_referendum_for_southern_slovakia_desc:0 "We have abandoned nationalistic ideas of the past, however, there are still vast amounts of our people in foreign lands, and this is an injustice, that we can not stand. We will start with Southern Slovakia, by proposing a democratic referendum to Czechoslovakia, in which the locals can decide, whether they want to stay in Czechoslovakia, or join Hungary instead."
 HUN_settlement_with_yugoslavia:0 "Settlement With Yugoslavia"
 HUN_settlement_with_yugoslavia_desc:0 "Next up, are the Hungarian people stuck in Yugoslavia after the Treaty of Trianon. We will offer them monetary reparations in return for some of the contested land. If all goes well, we will have ownership of Backa and Prekmurje after the negotiations."
 HUN_the_visegrad_group:0 "The Visegrád Group"
 HUN_the_visegrad_group_desc:0 "Hungary can not rely on far away powers to protect her, when the fascists come knocking. We have to take initiative, and form a local alliance, that is capable of protecting its members, without aid from overseas. Some like-minded thinkers are proposing a triangle alliance with Poland and Czechoslovakia, and we have received some positive feedback from their governments as well."
 HUN_invite_yugoslavia:0 "Invite Yugoslavia"
 HUN_invite_yugoslavia_desc:0 "Yugoslavia is alone, and surrounded by fascist neighbors, who would take their territory. Our allaince could use their strength, and influence in the Balkans, while we could offer them protection against foreign threats."
 HUN_invite_austria:0 "Invite Austria"
 HUN_invite_austria_desc:0 "Austria is in a precarious position, being wedged between Germany and Italy. Without proper protection, they would quickly be swallowed by either one of these fascist giants. We should extend an invitation to them, and offer the protection of the Visegrád Group."
 HUN_baltic_expansion:0 "Baltic Expansion"
 HUN_baltic_expansion_desc:0 "We have successfully laid the foundations of a new alliance, but it still needs more members. Poland has proposed an expansion of the alliance to the north, including Lithuania, Latvia and Estonia. Should they accept, our alliance will have access to the North Sea, but this might draw the Soviet Union's aggression towards us."
 HUN_economic_cooperation:0 "Economic Cooperation"
 HUN_economic_cooperation_desc:0 "Our alliance is what it is: a military alliance. However, if we could extend it to be an economic union as well, we could create a shared market between all member states, which (considering the regional capabilities of each member) could benefit everyone involved."
 HUN_joint_military_council:0 "Joint Military Council"
 HUN_joint_military_council_desc:0 "While individual members of our alliance might be powerful, the true potential of military allainces lies within cooperation. To make it easier for our armies to execute joint operations, we will establish a military board, which oversees these endavours."
 HUN_visegrad_technology_circle:0 "Visegrád Technology Circle"
 HUN_visegrad_technology_circle_desc:0 "We now share our economy with members of the Visegrád Group, so why not share our knowledge as well? Everyone would benefit from an exchange of research, and what better to arm ourselves with, than the shared knowledge of our allies?"
 HUN_third_way_democracy:0 "Third Way Democracy"
 HUN_third_way_democracy_desc:0 "By introducing well-proven and functioning methods of state administration in other countries, we can successfully create a new, modern Hungary."
 HUN_embrace_communism:0 "Embrace Communism"
 HUN_embrace_communism_desc:0 "Being overshadowed by the German Reich, and far away from the democratic liberals in the west, Hungary needs to seek its future elsewhere. Our country is not at all unfamiliar with bolshevik ideals, as the short-lived Hungarian Soviet Republic rose to power in 1919. We shall re-embrace this revolution and establish the worker's utopia in the Carpathian basin."
 HUN_the_rakosi_administration:0 "The Rákosi Administration"
 HUN_the_rakosi_administration_desc:0 "Now that the proper government has been set up, the time is ripe to start cleaning the political spectrum of undesrieable people. Those who oppose communism, oppose the common good of the people."
 HUN_the_yugoslavian_wall:0 "The Yugoslavian Wall"
 HUN_the_yugoslavian_wall_desc:0 "Our country would be defenseless against an invasion from Yugoslavia. If the Serbs suddenly think that they are not content with what they got at the Treaty of Trianon, they could flood the Hungarian plains in a matter of days. A system of fortifications will be built on our southern borders to prevent this."
 HUN_disz:0 "DISZ"
 HUN_disz_desc:0 "By forming the Association of Working Youth, we can help the development and strengthening of the socialist spirit among young people. In this way, we can more easily achieve the transformation of the country into a socialist state."
 HUN_the_kader_hill:0 "Kader Hill"
 HUN_the_kader_hill_desc:0 "An appropriate living environment must be provided to ensure the smooth running and loyalty of key political leaders. To do this, it is necessary to create a correspondingly luxurious residential environment in the capital."
 HUN_school_collectivization:0 "School Collectivization"
 HUN_school_collectivization_desc:0 "Iskolák állami kézbe vételével csökkenthetjük az egyház befolyását hazánkban és a fiatalokat a modern szocialista oktatás keretében készíthetjük fel az életre."
 HUN_political_commissars:0 "Political Commisars"
 HUN_political_commissars_desc:0 "The creation of Soviet-style political officers in the army can ensure the unconditional allegiance and effective functioning of the army to the socialist state."
 HUN_national_militia:0 "National Militia"
 HUN_national_militia_desc:0 "By creating a national guard, we can replace the army in certain tasks and we can also create a large reserve stock for the army."
 HUN_workers_militia:0 "Workers Militia"
 HUN_workers_militia_desc:0 "With permanent paramilitary formations to be set up among workers, we can create a large-scale armed organization that can be deployed at any time."
 HUN_socialism_with_a_human_face:0 "Socialism With Human Face"
 HUN_socialism_with_a_human_face_desc:0 " By guaranteeing fundamental rights extensively and equally, we can develop a more appropriate people's democracy for our country."
 HUN_secure_church_support:0 "Secure Church Support"
 HUN_secure_church_support_desc:0 "The Church has always played a major role in education and in shaping the way people think. Thus, by guaranteeing the rights of the church, it can be of great help in modernizing the education."
 HUN_the_patriotic_peoples_front:0 "Patriotic Peoples Front"
 HUN_the_patriotic_peoples_front_desc:0 "For the happiness of our people, for a free life, for the prosperity and peace of our country, all Hungarians, all patriots, communists and non-communists alike must unite."
 HUN_democratic_compromise:0 "Democratic Compromise"
 HUN_democratic_compromise_desc:0 "The development of people's democracy cannot be without widespread support. To do this, we need to join forces with other democratic groups to achieve our goals."
 HUN_reformcommunism:0 "Reformcommunism"
 HUN_reformcommunism_desc:0 "Due to the timely application of Marxist doctrines, there is a constant need to innovate in communist theory. To this end, we must ensure through continuous reforms that the ultimate goal is to achieve a classless society."
 HUN_fundamental_rights:0 "Fundamental Rights"
 HUN_fundamental_rights_desc:0 "Ensuring fundamental rights on a broad and equal basis for all is the foundation of popular democracy. Ensuring this at all times is the most important task of the state."
 HUN_market_economy:0 "Market Economy"
 HUN_market_economy_desc:0 "Instead of introducing planned management, which is popular in socialist countries, it is more appropriate to support market-based economic production. This is the real key to the economic development of our country, with which we can create a solid foundation for the well-being of the population."
 HUN_gateway_between_east_and_west:0 "Gateway Between East and West"
 HUN_gateway_between_east_and_west_desc:0 " Taking advantage of the favorable geographical position of our country, we can greatly promote the trade between East and West, from which the economy of our country can also benefit a lot."
 HUN_create_the_avo:0 "Create The ÁVO"
 HUN_create_the_avo_desc:0 "'Those who are not with us, are against us'. Enemies of the system must be eliminated, and we will need a secret police to find, and apprehend these undesrieable elements. The Államvédelmi Osztály (ÁVO) will serve as a counterintelligence unit, and a domestic state protection authority."
 HUN_connections_in_moscow:0 "Connections In Moscow"
 HUN_connections_in_moscow_desc:0 "If we want to thrive as a communist nation, we need to establish close ties with other followers of the worker's cause. We will reach out to the Soviet Union, to create a direct line from Budapest to Moscow, through which we can communicate in the case of an emergency."
 HUN_collectivization:0 "Collectivization"
 HUN_collectivization_desc:0 "Who could utilize the lands and factories of the country better, than the communist party? We will minimalize the amount of land, that is held by private citizens, and take matters into the hands of the state."
 HUN_five_year_plan:0 "Five Year Plan"
 HUN_five_year_plan_desc:0 "As a step towards a planned economy, we will introduce five year plans, that set short term goals for our nation. Everyone will have to perform according to this plan, and if we work hard enough, and keep the ultimate goal in sight, there is nothing that will stop us from achieving them."
 HUN_the_iron_curtain:0 "The Iron Curtain"
 HUN_the_iron_curtain_desc:0 "Nothing good ever comes from the capitalists and fascists in the west. We have to make an effort to isolate our people from the dangerous ideas they spread. Trade, emigration and immigration to non-communist countries will be heavily controlled, and we will limit diplomatic interactions with them."
 HUN_trojka:0 "Trojka"
 HUN_trojka_desc:0 "By setting up a three-member Defense Committee, we can speed up decision-making on key issues affecting the military, thereby greatly increasing efficiency."
 HUN_highly_planned_economy:0 "Highly Planned Economy"
 HUN_highly_planned_economy_desc:0 "By using state-regulated plans covering all sectors of the economy, we can ensure optimal utilization and economic development for our economy."
 HUN_great_budapest:0 "Great Budapest"
 HUN_great_budapest_desc:0 "By building the metro and developing the infrastructure, we can create a true socialist industrial metropolis by merging the small settlements around the capital."
 HUN_the_kadar_administration:0 "The Kádár Administration"
 HUN_the_kadar_administration_desc:0 "The ultimate goal of communism is the common well-being of the people. Those who do not actively hinder our efforts to achieve this, can exist in peace, and those who aid us, will be rewarded greatly."
 HUN_western_relations:0 "Western Relations"
 HUN_western_relations_desc:0 "Even though we chose communism over democracy, it would be foolish to abandon the west altogether, and only place our trust in our Soviet brethren. While we will stay loyal to the communist cause, we will also try to open up trade, and diplomatic relations with western countries, to keep our options open."
 HUN_goulash_communism:0 "Goulash Communism"
 HUN_goulash_communism_desc:0 "'Those who are not against us, are with us'. This is the philosophy we employ, when it comes to enemies of the system. The people will be kept in blissful welfare, which will make them more cooperative with the government. Prices of common consumer goods will be determined by the state, and they will always be available. This will no doubt incur extra costs, but it will keep the population content, and happy."
 HUN_modernize_the_railway_network:0 "Modernize The Railway Network"
 HUN_modernize_the_railway_network_desc:0 "The Hungarian railway is in dire need of improvement, as the restrictions set by the Trianon peace treaty forbode the construction of railways with more than one track. A thorugh expansion plan will be drafted and executed, which will modernize the existing railway lines, and make way for new ones."
 HUN_facilitate_full_employment:0 "Facilitate Full Employment"
 HUN_facilitate_full_employment_desc:0 "Everyone has to contribute to the advancement of our nation, and the communist cause. We have to make sure, that all people have a job, and something useful that they can do, and this means creating workplaces. Areas with high unemployment rates will undergo industrial and commercial development, so that everyone will be able to work towards a better future."
 HUN_planned_economy:0 "Planned Economy"
 HUN_planned_economy_desc:0 "We will remove excessive constraints that hinder individual initiative and responsibility, and we will reduce bureaucratic tendencies. The leading role of the state should not be based on the imposition and accountability of unrealistic planning instructions, but through economic regulators (prices, wages, credit, etc.) in which economic entities can operate independently."
 HUN_salami_tactic:0 "Salami Tactics"
 HUN_salami_tactic_desc:0 "Though the country is now in the grasp of the proletariat, the cancerous ideologies of the past still plague the parliament. It would be easiest if we put some effort into dividing the opposition into smaller groups, any played these groups against each other until they are finally ground up, leaving only the KMP."
 HUN_one_nation_one_party:0 "One Nation - One Party"
 HUN_one_nation_one_party_desc:0 "With the glorious rise of communism to power in the country, no other parties need to be present, as they only confuse voters. The one and only KMP will serve the needs of Hungary just fine."
 HUN_communist_international:0 "Communist International"
 HUN_communist_international_desc:0 "Now that the worker's culture is setting in in Hungary, the time has come to join the international cause, under the wings of the Third International. The Soviet Union will surely agree, that the newly communist Hungary would be a worthy member of the Comintern."
 HUN_soviet_license_trade:0 "Soviet License Trade"
 HUN_soviet_license_trade_desc:0 "Now that we have joined the glorious Soviet Union, we could perhaps convince them to share some of their knowledge with us. After all, the advancement of our country, is the advancement of communism in general."
 HUN_hungarian_research_cities:0 "Hungarian Research Cities"
 HUN_hungarian_research_cities_desc:0 "The Soviets have built entire towns and cities, where the primary work conducted is research and development of new technologies. We should try to do the same, and establish contact with their research groups, in order to share our knowledge."
 HUN_the_country_of_iron_and_steel:0 "The Country Of Iron And Steel"
 HUN_the_country_of_iron_and_steel_desc:0 "The Soviet Union is rich in natural resources, but less so in industrial capacity to process them. The commercial comittee they sent, has decided that our country shall aid their steel industry. We will receive iron and coal, and process it into steel for the USSR. We also have been given permission to use a percentage of the steel for our own purposes in local factories."
 HUN_worker_spirit:0 "Worker Spirit"
 HUN_worker_spirit_desc:0 "In accordance with communist ideals, each and every citizen of the country has to take their share of the work. A newly proposed law would practically outlaw unemployment, and ensure, that everyone does something remotely useful for the country."
 HUN_spreading_the_revolution:0 "Spreading The Revolution"
 HUN_spreading_the_revolution_desc:0 "Our country stands as a bastion of the revolution, a light in the darkness of imperialism. What we need to do, is take this light to other nations, and plant the seeds of the revolution, or support it if it is already present. Eventually, the whole world will join our cause, and we will be remembered as the godfathers of communism."
 HUN_soviet_officer_training:0 "Soviet Officer Training"
 HUN_soviet_officer_training_desc:0 "In case of a conflict, we need to coordinate our armies together with the Soviets better, and some of our army officers could use some training anyway. We will establish a joint training program, employing generals from the Soviet army to train our officers."
 HUN_german_revolution:0 "German Revolution"
 HUN_german_revolution_desc:0 "The greatest of our enemies, Germany is ready to jump at our throat. While taking a stand against them, and fighting them off would be a heroic feat indeed, we might just turn them to our side, if we play our cards right. A communist revolution in Germany would not only ensure our safety, but strenghten our ideals in Europe altogether, granted it would still be a costly endavour."
 HUN_italian_revolution:0 "Italian Revolution"
 HUN_italian_revolution_desc:0 "Now, that the fascists have been defeated in Germany, Italy has to be brought in line next. We will employ the same tactics as in Germany: worker strikes, support for the Italian communist party, and anti-fascist propaganda."
 HUN_polish_communism:0 "Polish Communism"
 HUN_polish_communism_desc:0 "Our Polish friends have not yet embraced communism. They need a push in the right direction, and with the necessary support from us, they could be shown the right path."
 HUN_the_warsaw_pact:0 "The Warsaw Pact"
 HUN_the_warsaw_pact_desc:0 "If we want to spread the revolution into all of Eastern Europe, we have to rethink the terms of our alliance. We will propose transforming the Comintern into a more open association, which would welcome any friendly states in the region, starting with Poland."
 HUN_armament_unificiation:0 "Armament Unification"
 HUN_armament_unificiation_desc:0 "The Warsaw Pact needs to be more than a formal cooperation of its members. If we want to defend ourselves against the imperialist west, we need to coordinate our armies, and our arms. We will propose a unification of arms, which will standardize, among others, weapon sizes and ammunition types for all member countries."
 HUN_rescue_bela_kun:0 "Rescue Béla Kun"
 HUN_rescue_bela_kun_desc:0 "Béla Kun was one of the prevalent leaders of the short lived Council Republic in Hungary, in 1919. After failing to solidify communism in the country, he fled Hungary, and ended up in the Soviet Union, where he resides ever since. However, he is in increasingly more danger, as Stalin's paranoia drives him to execute political figures around him. We have to organize his escape, if he is to survive."
 HUN_wage_reform:0 "Wage Reform"
 HUN_wage_reform_desc:0 "By reforming wages, we can reduce the pay gap and raise the living standards of the working class and the peasantry. In this way, we can also boost domestic consumption and economic development."
 HUN_revolutionary_court:0 "Revolutionary Court"
 HUN_revolutionary_court_desc:0 "Now that the Council Republic has been restored, we must ensure that it stays intact, and doesn't fall to the misguided efforts of counter-revolutionaries. The revolutionary court will act as a tool for suppressing undesirable elements, and silencing those who would topple communism in Hungary."
 HUN_red_guard:0 "Red Guard"
 HUN_red_guard_desc:0 "The police force, the gendarmerie, and the border patrol will be replaced with a common peacekeeping force: the Red Guard. This organization will be entirely loyal to the Council Republic, and will help maintain order in the country."
 HUN_the_council_of_nations:0 "The Council Of Nations"
 HUN_the_council_of_nations_desc:0 "Time has shown, that lonely communist republics are not strong enough to stay in power. Instead of succumbing to the ever expanding Soviet Union, we have to seek cooperation with the surrounding nation states. We will invite the communist parties of neighboring states, and propose a federation, which will be a free association of communist states."
 HUN_the_danube_federation:0 "The Danube Federation"
 HUN_the_danube_federation_desc:0 "The time has come to put our words into action, and create the Danube Federation. The initial signatories are ready to join the new association, and the rest will hopefully follow soon enough."
 HUN_comittee_for_federal_security:0 "Comittee For Federal Security"
 HUN_comittee_for_federal_security_desc:0 "The Danube Federation has been a successful endavour, but it is still fragile. We will need to protect it from outside threats, may they be military, or ideological. A comittee will be established, to monitor the flow of information in and out of the federation, and intervene if necessary."
 HUN_concentrated_construction_effort:0 "Concentrated Construction Effort"
 HUN_concentrated_construction_effort_desc:0 "Our federation may be small, but it has great potential. We need to concentrate our efforts on developing the less developed regions in each country, to tap into this potential, and elevate the poorer regions of the alliance. We will periodically shift these efforts to a different country, so that the benefits are distributed evenly."
 HUN_federal_reserve_guard:0 "Federal Reserve Guard"
 HUN_federal_reserve_guard_desc:0 "We can not expect the members of the Danube Federation, to agree to unifying the armies of the alliance, but that does not mean, that there is no room for military cooperation. We will establish a federal reserve, which each nation will have to commit a certain percentage of their reserves to. Any member will be able to use these reserves, which will help in distributing the troops as necessary."
 HUN_danube_scientific_institute:0 "Danube Scientific Institute"
 HUN_danube_scientific_institute_desc:0 "The potential for scientific improvement that exists within the Danube Federation can not go to waste. For the common good of our alliance, we will found a shared research institution in Budapest, which will include scientists from all member states of the federation."
 HUN_a_bastion_against_fascism:0 "A Bastion Against Fascism"
 HUN_a_bastion_against_fascism_desc:0 "We clearly need to prepare ourselves for an eventual war against fascism. Our northern and western borders need to be appropriately fortified if we want to have any hope of stopping their advance."
 HUN_preparations_for_the_war:0 "Preparations For The War"
 HUN_preparations_for_the_war_desc:0 "We have to be prepared for the imminent war ahead, if we wish to persist as a nation. This means stricter laws regarding mobilization and recruitment, and a clearly defined foreign policy."
 HUN_war_on_fascism:0 "War On Fascism"
 HUN_war_on_fascism_desc:0 "We are now properly prepared for the great war ahead. The war to purge fascism from the face of the earth."
 HUN_territorial_policy:0 "Territorial Policy"
 HUN_territorial_policy_desc:0 "Once we have acquired land that was lost in the Treaty of Trianon, we have to decide what to do with it. If we want it to be fully part of our country, we have to take steps to integrate it."
 HUN_integration_focus:0 "Integration Focus"
 HUN_integration_focus_desc:0 "In order to assimilate the population in the newly acquired territories, we have to get them to cooperate, otherwise they will never feel like they are a part of us. Peaceful integration is the way to go."
 HUN_minority_rights:0 "Minority Rights"
 HUN_minority_rights_desc:0 "We can't expect foreign ethinicities to assimilate in a matter of years, so the easiest way to integrate them, is to give them the same, (or almost the same) rights, as the rest of our citizens. This way they won't feel like they are foreigners in our country."
 HUN_suppression_focus:0 "Suppression Focus"
 HUN_suppression_focus_desc:0 "Total cooperation of the local population in newly acquired territories is necessary, if we wish to make use of them in the army. That is why we must root out any feelings of nationalistic pride from them, and aggressively assimilate them as soon as possible. It might come with a few losses, but the goal justifies the means."
 HUN_hungarization:0 "Hungarization"
 HUN_hungarization_desc:0 "It is not enough, that the population of the integrated territories is not against us. We have to instill Hungarian ideals in them, and make them understand, that they have to fight for this country, if they are to live in it. Through media, education, and laws, we will convert every citizen of our country to faithful servants of the nation."
 HUN_revisionism:0 "Revisionism"
 HUN_revisionism_desc:0 "Achieving a revision of the Trinonian dictatorships is the most important goal of our country. To achieve this, military, diplomatic and economic means can be used equally."
 HUN_revision_by_force:0 "Revision by Force"
 HUN_revision_by_force_desc:0 "In the Treaty of Trianon, Hungary was separated from Austria, and most of her territory was unjustly ripped from her. It is clear that diplomacy will get us nowhere in this matter, so we will use force if we need to."
 HUN_celebrate_the_successful_revision:0 "Celebrate The Successful Revision"
 HUN_celebrate_the_successful_revision_desc:0 "We have achieved our goal of regaining the territory, that was ripped from us in the Treaty of Trianon. This is due cause for celebration, and in honor of this event, we will appoint a new national holiday, that will commemorate this date for time eternal."
 HUN_hungary_first:0 "Hungary First"
 HUN_hungary_first_desc:0 "We are alone in our fight to recover our lost territory. Time has proven that no one is interested in revising the Treaty of Trianon, so we have to take matters into our own hands, and gather allies, or face alone anyone who opposes us."
 HUN_conscription_reforms:0 "Conscription Reforms"
 HUN_conscription_reforms_desc:0 "Outright extending conscription might couse public outrage, but if we carefully juggle with laws, we might still acquire a bigger pool of manpower. Give a little ground here, take away a little over there, and the entire thing is already dodgy enough to confuse most people."
 HUN_revisionist_education:0 "Revisionist Education"
 HUN_revisionist_education_desc:0 "Our education system has to embrace the ideas of revisionism, and pass on the spirit to the younger generations. The former glory of Hungary will be taught in schools, instilling national pride into the very essence of children. The minister of education, Kuno von Klebelsberg has devised a detailed plan to reform the education system."
 HUN_budapest_research_group:0 "Budapest Research Group"
 HUN_budapest_research_group_desc:0 "Our faction's backbone is cooperation, as most of its members are too small to protect themselves individually. This is no different when it comes to research. We must make every effort to cooperate with the scientists of our allies."
 HUN_polish_hungarian_intelligence_exchange:0 "Polish-Hungarian Intelligence Exchange"
 HUN_polish_hungarian_intelligence_exchange_desc:0 "To best safeguard our nation, our intelligence corps have to undertake international missions, and gather whatever information they can find. Poland, an old friend of Hungary, would be a valuable partner in this, and as long as the agreement is mutual, they would be willing to help."
 HUN_invite_poland:0 "Invite Poland"  
 HUN_invite_poland_desc:0 "Poland and Hungary have ever been great friends. Now that we have decided to stand on our own in the great conflicts to come, it might be wise to deepen the friendship between our peoples, and form an alliance with Poland."
 HUN_support_polish_claims:0 "Support Polish Claims"
 HUN_support_polish_claims_desc:0 "After the Great War, Poland was given access to the sea through Danzig, which makes their German borders vulnerable, and it look hideous. It would make a lot more sense, to give Poland the entirety of Ostpreussen, leaving both countries with a more consolidated territory. We will use our influence to support Poland's claims in the region."
 HUN_invite_bulgaria:0 "Invite Bulgaria"
 HUN_invite_bulgaria_desc:0 "Bulgaria has served our cause in the Great War out of necessity more than friendship. Maybe they could do so again, if we strengthened our relationship with them a bit. We could lure them into our newly formed faction with promises of territorial gains from Yugoslavia and Romania."
 HUN_burgas_industrial_development_project:0 "Burgas Industrial Development Project"
 HUN_burgas_industrial_development_project_desc:0 "The military nature of our alliance with Bulgaria might distance us from them, but that won't stop us from trying to build a genuine friendship between our countries. We will help develop their industry in one of the less advanced regions of their country, which will surely earn their gratitude, and also make htem a stronger ally."
 HUN_secure_dobrudja:0 "Secure Dobrudja"
 HUN_secure_dobrudja_desc:0 "One of the past grievances of Bulgaria is the many Bulgarians in Dobrudja, who have to suffer the reign of the vile Romanians, enduring oppression at every turn. As our alliance grows stronger, so does our international influence. We could use this influence to pressure Romania into handing over parts (if not all) of Dobrudja to Bulgaria."
 HUN_help_finland:0 "Help Finland"
 HUN_help_finland_desc:0 "Finland is under threat from the Soviet Union, and in dire need of assistance. By offering them a helping hand, we'd be able to indirectly hinder the effort of the communists."
 HUN_invite_finland:0 "Invite Finland"
 HUN_invite_finland_desc:0 "Now that we have proven our good intentions to the Finns, they will surely accept a full invitation into our alliance. They could make a valuable ally against the Soviets, whom we will eventually have to fight."
 HUN_turkish_alliance:0 "Turkish Alliance"
 HUN_turkish_alliance_desc:0 "Hungary and Turkey have had their differences in the past, but we shouldn't hold century old grudges, when friendship is beneficial to both of our countries. Just as they have fought on our side in the Great War, so can they aid our cause now, that we have formed our own alliance."
 HUN_turkish_troop_exchange:0 "Turkish Troop Exchange"
 HUN_turkish_troop_exchange_desc:0 "Alliances are built on mutual trust. We could ensure this trust with Turkey, if our armies would perform an exchange of soldiers, giving both countries control of a small group of the other's soldiers. This might bring other benefits in the long run, as the soldiers would bring their experience with them, potentially helping both cuntries develop their armed forces."
 HUN_turkish_troop_exchange_tt:0 "We will receive some divisions from Turkey, and send them the same amount.\n"
 HUN_reinforce_turkish_claims:0 "Reinforce Turkish Claims"
 HUN_reinforce_turkish_claims_desc:0 "The once proud Ottoman Empire has been forced to relinquiesh control of most of its territory outside of Anatolia after the Great War. Many wish to see these lands restored to the Turks, our allies, and making them stronger would in turn make our alliance stronger. We will officially back their claims on Syria, and the Eastern Mediterranean."
 HUN_greek_alliance:0 "Greek Alliance"
 HUN_greek_alliance_desc:0 "The Turks have caused our nation a great deal of suffering in the 16th and 17th centuries. The Greeks suffered an even longer period of occupation, and our past is linked in other ways as well. The crown of St. Stephen was gifted by a Byzantine emperor to the King of Hungary, a kindness which we wish to repay now. We will join forces with the Greeks, and lay waste to the Turkish fiends!"
 HUN_megali_idea:0 "Support The Megali Idea"
 HUN_megali_idea_desc:0 "Ever since the Greeks declared their independence from the Ottomans, they have dreamt of unifying all ethnically, and historically Greek lands. This dream has come to be known as the 'Megali Idea', and encompasses a lot of territory, that is still under Turkish rule. Most of the Greeks have been transferred from Anatolia during the 1923 population exchange, but they still maintain claims to those lands."
 HUN_strike_turkey:0 "Strike Turkey"
 HUN_strike_turkey_desc:0 "Everything is ready for a grand war of revenge against Turkey. With our Greek friends backing us, we will surely bring the dying Turkish beast to its knees, giving them a taste of what we had to suffer for centuries during the Turkish occupation."
 HUN_befriend_austria:0 "Befriend Austria"
 HUN_befriend_austria_desc:0 "The once blooming Austro-Hungarian friendship has all but dissolved. If we hope to gain them as our allies, we have to reawaken this dying relationship between the two countries."
 HUN_war_with_austria:0 "War With Austria" 
 HUN_war_with_austria_desc:0 "Austria lies in the way of hungarian revisionism. The world needs to be shown, what the newfound strength of our nation can accomplish, and our western neighbor will be a perfect target for this demonstration."
 HUN_allied_investment:0 "Allied Investment"
 HUN_allied_investment_desc:0 "Our industry is now strong enough to make large industrial investments with our allies as well. In doing so, we strengthen our allies who are much weaker than us."
 HUN_the_burgenland_referendum:0 "The Burgenland Referendum"
 HUN_the_burgenland_referendum_desc:0 "Burgenland, a small piece of land taken from Hungary after the Great War, is mainly inhabited by Hungarians. If we could convince Austria to enable a referendum for the people of Burgenland, in which they could decide whether to join Hungary, they would surely vote in favor of the notion."
 HUN_restore_the_austro_hungarian_monarchy:0 "Restore The Austro- Hungarian Monarchy"
 HUN_restore_the_austro_hungarian_monarchy_desc:0 "The end of the Great War saw the downfall of the Austro-Hungarian Empire. Now might finally be the time to reawaken the once proud monarchy. Otto von Habsburg, eldest son of Charles I, the last reigning monarch of Austria-Hungary, is still alive and well, and would make the perfect king for this new monarchy."
 HUN_south_slavic_trialism:0 "South Slavic Trialism"
 HUN_south_slavic_trialism_desc:0 "During the years of the Great War, the idea of Trialism - turning the dual monarchy into a three-state monarchy, by adding Croatia - was brought up as a resolution to the growing tension between the nationalities of the empire. We could revitalize this idea, and build our nation on the cooperation of Germans, Hungarians, and Slavs."
 HUN_czech_trialism:0 "Czech Trialism"
 HUN_czech_trialism_desc:0 "The idea of Trialism (a conversion of the dual monarchy into a three-state monarchy) has been around for as long as Austria-Hungary. It could indeed add much desired stability, if more of the nationalities were associated with the country directly. The logical choice are the Czechs, as their country serves as the industrial powerhouse of our country, and earning their loyalty is of utmost importance."
 HUN_compromise_with_the_nationalities:0 "Compromise With The Nationalities"
 HUN_compromise_with_the_nationalities_desc:0 "If we truly wish to maintain the empire as it is, with its miriad of nationalities, we will have to reach a compromise with all of them. We will not elevate all minorities to the position of Hungarians, Austrians, or Slavs, but we must reach a consensus with them, if the empire is to survive."
 HUN_wilsons_10th_point:0 "Wilson's 10th Point"
 HUN_wilsons_10th_point_desc:0 "President Woodrow Wilson had a very different plan for the fate of Austria-Hungary, than what actually came to pass. He wanted to turn it into a federation, in which nationalities had some level of self governance. If we modified the concept a little, we could transform into a federal monarchy, in which the ultimate authority is still the monarch, but regional decisions are delegated to local parliaments."
 HUN_regional_elections:0 "Regional Elections"
 HUN_regional_elections_desc:0 "The federation is considerably more stable, than the monarchy preceding it, but the multinational population is still not quite content with the representation of its interests. Instead of appointed representatives, we could have locally elected representatives, that hold office for four years. This would mean relinquishing some of the control over the politics of our nation, in return for more stability."
 HUN_empires_of_old:0 "Empires Of Old"
 HUN_empires_of_old_desc:0 "There were certain monarchist circles in France in the 1920s, that endorsed the creation of a Central European multi-ethnic monarchy, but their influence wasn't sufficient. Perhaps with a restored French monarchy, our chances at cooperation would be better, and we could even invite them into our alliance."
 HUN_remind_the_germans_of_the_glory_days:0 "Remind The Germans Of The Glory Days"
 HUN_remind_the_germans_of_the_glory_days_desc:0 "Most foreign powers opposed the restoration of Austria-Hungary, and they may not tolerate its existence for long. Our old allies in Germany have been turned away from traditional imperialism, but the memory of the glorious German Empire still lives in their hearts. We could try to rally the supporters of the old monarchy around the German crown prince Wilhelm, who is out on the frontlines, fighting."
 HUN_the_kaisers_coup:0 "The Kaiser's Coup"
 HUN_the_kaisers_coup_desc:0 "The crown prince's support has grown large enough, that a coup might be able to succeed. If we helped organize such a coup, we could very well be able to restore the Hohenzollerns to power, and find a new ally in the German Empire."
 HUN_develop_austrian_ironworking:0 "Develop Austrian Ironworking"
 HUN_develop_austrian_ironworking_desc:0 "The mountains of Austria have tons of unexploited minerals in them, waiting for us to extract them. By spending a little effort, we could multiply the steel production in the area, and produce enough for a completely new factory."
 HUN_renew_the_hindenburg_plan:0 "Renew The Hindenburg Plan"
 HUN_renew_the_hindenburg_plan_desc:0 "The Hindenburg Plan of the Great War, implemented in Germany and Austria-Hungary, was not the success it was hoped to be, but it had some good ideas. Using what we have learned from its setbacks, we could renew the program, in hopes of better utilizing our resources and industrial capacity."
 HUN_albanian_satellite:0 "Albanian Satellite"
 HUN_albanian_satellite_desc:0 " Albania is the gateway to the Adriatic, which is why we must involve us in our sphere of interest by all means in order to ensure Adriatic shipping for our country."
 HUN_skoda_steel_works:0 "Skoda Steel Works"
 HUN_skoda_steel_works_desc:0 "The Skoda Works is one of the greatest industrial concerns in the Czech economy. If we want to fully take advantage of the local resources, we should provide them with government contracts, and enable them to exploit the raw materials of the region."
 HUN_revenge_for_trianon:0 "Revenge For Trianon"
 HUN_revenge_for_trianon_desc:0 "The time has come to strike back at those who wronged us after the Great War. The French have been the most cruel to us during the Treaty of Trianon, so we will extract revenge on them first."
 HUN_galicia_for_guarantees:0 "Galicia for Guarantees"
 HUN_galicia_for_guarantees_desc:0 "Krakow and Galicia were parts of the Austro-Hungarian Empire ever since its birth. Poland needs to be reminded who these territories belong to, and in return, we can offer them a guarantee of protection. If they refuse to coopoerate, we will have a valid reason to take everything by force."
 HUN_the_bucovina_question:0 "The Bucovina Question"
 HUN_the_bucovina_question_desc:0 "There is small piece of land called Bucovina in the northern corners of Romania. Parts of the population there are Hungarian, which would be reason enough to demand the state, but it is also a historical part of Austria-Hungary. Romania will have to cede the territory, unless they want to risk war with the might of our nation."
 HUN_imperialist_coup_in_czechoslovakia:0 "Imperialist Coup In Czechoslovakia"
 HUN_imperialist_coup_in_czechoslovakia_desc:0 "Czechoslovakia is righfully a part of our Empire. However, we can't just outright demand their annexation, as their current government is unwilling to cooperate. If we staged a pro-Austria-Hungary coup in the country, the new leadership would surely thank us by aiding our efforts."
 HUN_merge_with_czechoslovakia:0 "Merge With Czechoslovakia"
 HUN_merge_with_czechoslovakia_desc:0 "Austria and Hungary have been united, but the restoration of the empire has only just started. Czechoslovakia can not stand on its own, and should be reunited with us. We will propose a peaceful integration of their territory, and in return offer protection, and some amounts of autonomy."
 HUN_demand_italian_provinces:0 "Demand Italian Provinces"
 HUN_demand_italian_provinces_desc:0 "Italy is a proud nation, and despite her past failures, a force to be reckoned with. This is why it might prove difficult to strike a deal with the Italians, and make them return old provinces of the monarchy. We will use our influence in the Balkans, and sanctify their expansion into Greece. They may have Epirus and Crete, if they return South Tyrol and Istria."
 HUN_draw_closer_to_germany:0 "Draw Closer To Germany"
 HUN_draw_closer_to_germany_desc:0 "Hungary was not the only country unfairly humiliated in the peace treaties after the Great War. Germany might agree to help us in our efforts, if we bind ourselves to them."
 HUN_military_science_division:0 "Military Science Division"
 HUN_military_science_division_desc:0 "Though our country stands strong, there are obviously some areas deserving of improvement. The Germans have made some stellar advancements in several technological fields, and being the good friends they are, they gladly offer their help, if we delegate a group of scientists to study their innovations."
 HUN_synthetic_oil_effort:0 "Synthetic Oil Effort"
 HUN_synthetic_oil_effort_desc:0 "Like us, Germany also lacks extensive oil supplies. They have made significant advancements in the field of synthetic oil production, which we too could utilize."
 HUN_negotiations_with_italy:0 "Negotiations With Italy"
 HUN_negotiations_with_italy_desc:0 "Italy is right at our doorstep, yet diplomatic relations are very much uncertain between our countries. We should try to negotiate a treaty with them, stabilizing our diplomatic stance, and maybe benefiting both countries in the process."
 HUN_the_adriatic_initiative:0 "The Adriatic Initiative"
 HUN_the_adriatic_initiative_desc:0 "We need to pursue closer ties with Italy. Now that we have access to the sea, we have a common interest with them: The defense of the Adriatic Sea. We will propose a shared shipbuilding, and naval research initiative, which will help us catch up, and help them better defend their shores."
 HUN_cooperation_with_italy:0 "Axis Cooperation"
 HUN_cooperation_with_italy_desc:0 "We now have common research initiatives with both Germany, and Italy. It is time to bring the two together, and work towards the advancement of our entire alliance, instead of just the individual countries in it."
 HUN_axis_membership:0 "Economic Cooperation"
 HUN_axis_membership_desc:0 ""
 HUN_GER_AXIS:0 "The Axis"
 HUN_GER_CENTRAL_POWERS:0 "The Central Powers"
 HUN_GER_GERMANYS_FACTION:0 "Germany's Faction"
 HUN_exit_attempt:0 "Exit Attempt"
 HUN_exit_attempt_desc:0 "We have been dragged into a war by Germany, and many are proposing that this is a war we can not win. If that is indeed the case, we need to get out if this conflict immediately. Should an opportunity present itself, we will try to switch sides. This attempt has to be kept a secret, otherwise the Germans might intervene aggressively."
 HUN_fall_of_the_ussr:0 "Prepare for Barbarossa"
 HUN_fall_of_the_ussr_desc:0 "The bolsheviks are on our borders, hungrily staring at us. We should take the fight to them, before they decide to do the same to us. With our friend and ally Germany behind us, the Soviets don't stand a chance."
 HUN_hungarian_german_research_effort:0 "Hungarian-German Research Effort"
 HUN_hungarian_german_research_effort_desc:0 "Germany is spearheading the research effort, when it comes to military applications. We have a lot to learn from them, but the same is true in reverse. We should create a common research group, that would work for the benefit of both countries."
 HUN_assistance_from_the_general_staff:0 "Assistance From The General Staff"
 HUN_assistance_from_the_general_staff_desc:0 "We have now strengthened our ties with Germany, and proven that we are willing to support them. If we are to help them in the future, our military leaders have to coordinate their actions properly. We will request that part of their General Staff be delegated to Hungary, and cooperate with our high command."
 HUN_men_for_burgenland:0 "Men For Burgenland"
 HUN_men_for_burgenland_desc:0 "The German war situation is desperate. They are in serious need of new recruits, if they want to continue fueling their war machine. We could propose an exchange to them, in which we give them recruiteble men, in return for Burgenland."
 HUN_men_for_burgenland_non_fascist:0 "Men For Burgenland"
 HUN_men_for_burgenland_non_fascist_desc:0 "The German war situation is desperate. They are in serious need of new recruits, if they want to continue fueling their war machine. We could propose an exchange to them, in which we give them recruiteble men, in return for Burgenland."
 HUN_extensive_conscription:0 "Increase Conscription"
 HUN_extensive_conscription_desc:0 "Our nation is small, and can not field a big enough army, to rival the bigger powers in Europe. We have to do everything to countermand this, starting with our conscription laws. We will need every able bodied man in the army, if we are to enforce our demands on our neighbors."
 HUN_the_rongyos_garda:0 "The Rongyos Gárda"
 HUN_the_rongyos_garda_desc:0 "After our defeat in the Great War, the Rongyos Gárda - a ragtag band of volunteer troops - has helped to secure the western borders of our small country, including Sopron, which would probably be an Austrian city, if it wasn't for them. They have again been a great help after the events of the First Vienna Award, in keeping the Slovaks occupied. We should provide them with government funding and support."
 HUN_military_land_survey:0 "Military Land Survey"
 HUN_military_land_survey_desc:0 "The country has recently grown, and if we want to keep our new territories, we have to be able to defend them. Our military needs better, more detailed maps of the country, than those that are currently available. We will order a nation-wide survey to be conducted by the army, which will give us a better chance at mounting a defense, if we need to."
 HUN_promote_hungarism:0 "Promote Hungarism"
 HUN_promote_hungarism_desc:0 "The country could benefit from having a national socialist government, that can convince the population to make every effort to aid the country. The Arrow Cross Party is getting more and more popular, and with a little help, they could soon end up as the ruling party."
 HUN_hungarian_ss:0 "Hungarian SS"
 HUN_hungarian_ss_desc:0 "We could strike a deal with Germany, and let them conscript Hungarians, and Germans from Hungary into their Waffen SS, in return for some subsidies for our tank production. Our soldiers would be safe under German leadership, and in return we would get the technology, and the means to produce armored units of our own."
 HUN_declare_state_of_emergency:0 "Declare State Of Emergency"
 HUN_declare_state_of_emergency_desc:0 "In these times of international tension, and conflict, we must not let our country be divided and indecisive. A single entity has to take power, until the chaos subsides, and lead the country through distress and hardship. We will entrust Ferenc Szálasi, the leader of the nation, with all the power he needs to guide us through these uncertain times."
 HUN_social_reforms:0 "Social Reforms"
 HUN_social_reforms_desc:0 "Religious matters will be heavily controlled by the state, and churches will not be allowed to partake in politics. Worker unions, and strikes will be outlawed. Emigration, and immigration will also be restricted, and Hungarians living abroad will be resettled to the homeland. The reforms will also affect the healtcare system, and state employees, and include a strict censorship of media and literature."
 HUN_national_socialist_industry:0 "National Socialist Industry"
 HUN_national_socialist_industry_desc:0 "In the spirit of our new national ideals, we will seize the facilities, and tools of production, so that the state can use them to serve the nation. Material wealth is but the means to an end, not the end in itself. The individual must subordinate himself to the cause of the nation, if we are to succeed in creating the ideal Hungarian state."
 HUN_the_order_of_the_working_nation:0 "The Order Of The Working Nation"
 HUN_the_order_of_the_working_nation_desc:0 "Now that the obsolete social institutions have been dismantled, the new order of our society can be established. People will be divided into 14 castes, such as farmers, workers or soldiers, and each caste will have a designated leader, to represent their interests, and help guide the nation."
 HUN_united_lands_hungaria:0 "Conscript Minorities"
 HUN_industrial_and_work_reforms:0 "Industrial And Work Reforms"
 HUN_industrial_and_work_reforms_desc:0 "Some industrial branches have been needlessly overdeveloped since 1920. These developments will stop, and a new industrial system will be established, that relies on agriculture. Interest free credit will be introduced for those, who wish to develop Hungarian lands and businesses, and matters of land ownership will be regulated by the constitution."
 HUN_total_economic_mobilization:0 "Total Mobilization"
 HUN_total_economic_mobilization_desc:0 "A state of war requires the subordination of the country’s economy to full military purposes. To do this, the population must endure the ordeals that come with it in order to achieve our goals."
 HUN_domestic_focus:0 "Domestic Focus"
 HUN_domestic_focus_desc:0 "Tax money, and personal wealth can only be spent in the country, and those who take their money abroad, will be charged with treason. International trade will exclusively be handled by the state. The army will undergo a restructurization, and modernization, and its soldiers will be drafted from all nationalities."
 HUN_the_industrialized_agrarian_state:0 "The Industrialized Agrarian State"
 HUN_the_industrialized_agrarian_state_desc:0 "The nation will transform into a modern, agrarian society, and social structure will undergo thorough rearrangement. Industrial, and agricultural regulations will be introduced into the constitution, and factory workers will be bound by law to work at the same place for a certain time."
 HUN_reinforce_the_gendarmerie:0 "Reinforce The Gendarmerie"
 HUN_reinforce_the_gendarmerie_desc:0 "Though the gendarmerie was disbanded after the Great War, it was reestablished soon after, and has served our country well ever since. Some have proposed, that we should expand the rights of the gendarmerie, to help them better preserve the calm and order in our state."
 HUN_expand_the_levente_associations:0 "Expand The Levente Associations"
 HUN_expand_the_levente_associations_desc:0 "The youth of our nation is receiving patriotic education within the bounds of the Levente Associations. The Leventes also get pre-military training, so it is a good stepping stone for those who wish to join the army. It is time to expand this institution, to make sure no child gets left without nationalistic indoctrination."
 HUN_enact_home_defense_law:0 "Enact Home Defense Law"
 HUN_enact_home_defense_law_desc:0 "The political situation around us is starting to look dangerous. It would be wise to gear up for defense, and in order to do so, we need the proper legislative support. The Home Defense Law will enable the government to enact special war measures through a committee."
 HUN_maintain_conservative_government:0 "Maintain Conservative Government"
 HUN_maintain_conservative_government_desc:0 "Our current government is strong, but we need to take measures to keep our power uncontested. We will commit to the conservative ideas of the current cabinet, and ensure, that extremist movements do not gain too much ground."
 HUN_ban_the_arrow_cross_party:0 "Ban The Arrow Cross Party"
 HUN_ban_the_arrow_cross_party_desc:0 "The hungarist ideas of Szálasi have plagued our nation long enough. He himself will be arrested and imprisoned, and his political party will be outlawed, along with any other movements and poltical entities, that associate themselves with the Arrow Cross."
 HUN_state_ammunition_factory:0 "State Ammunition Factory"
 HUN_state_ammunition_factory_desc:0 "We could boost our national economy by investing state money into the arms industry directly. Ammunition factories would serve this purpose well, in addition to providing supplies for the army."
 HUN_introduce_foreign_service:0 "Introduce Foreign Service"
 HUN_introduce_foreign_service_desc:0 "Field experience is invaluable in the training of our troops. While we might not always be engaged in armed conflict, we can surely find a war or two around the world, that we are willing to fight for a sympathetic nation. By making foreign service mandatory, we can indirectly influence foreign conflicts, and provide our soldiers with additional training."
 HUN_swing_politics:0 "Swing Politics"
 HUN_swing_politics_desc:0 "We have to keep our diplomatic options open at all times, if we don't want to end up on the losing side again. By 'swinging' back and forth between the allies and the axis, we can try to remain undecided for as long as it is possible, and only choose sides once we are sure that we are making the right choice."
 HUN_expansionism:0 "Expansionism"
 HUN_expansionism_desc:0 "We have stayed neutral long enough. We need to take our fate into our own hands, and fight those who would see our country destroyed. The lands of Hungary will be reclaimed by force, not by means of diplomacy."
 HUN_request_foreign_assistance:0 "Request Foreign Assistance"
 HUN_request_foreign_assistance_desc:0 "Hungary is too small to restore its old territories alone. We need to seek the friendship, and help of powers abroad, if we are to succeed in our revisionist endavours."
 HUN_align_with_poland:0 "Align With Poland"
 HUN_align_with_poland_desc:0 "The Poles have been friends of Hungary for centuries past. They are wedged between greater powers, yet they haven't bent their knees to any of them. We could seek an alliance with them, and together defend against east and west alike, maybe even regain some of our old territories in the process."
 HUN_operation_tripod:0 "Operation Tripod"
 HUN_operation_tripod_desc:0 "The next destination for the enlargement of the new alliance is Romania. However, the poor diplomatic relations between Hungary and Romania must be remedied by a peaceful settlement of Transylvania's affiliation."
 HUN_operation_crowbar:0 "Operation Crowbar"
 HUN_operation_crowbar_desc:0 "With joint Polish-Hungarian action against Czechoslovakia, we can regain our annexed territories and finally the common Polish-Hungarian border will be established."
 HUN_renew_the_polonia_military_aid:0 "Renew The Polonia Military Aid"
 HUN_renew_the_polonia_military_aid_desc:0 "During the Polish-Soviet war in 1920, Hungary supplied the Polish army with small arms and ammunition. The planned military aid would have extended to volunteer corps as well, but this did not come to pass. The agreement could be renewed with additional avenues of cooperation, like joint production of war material, or research."
 HUN_approach_the_scandinavian_states:0 "Approach the Scandinavian States"
 HUN_approach_the_scandinavian_states_desc:0 "By expanding the alliance to the north, we can more effectively secure our countries against the growing German and Soviet policies of aggression and, in the event of a possible attack, we can use more military force to guarantee the security of our countries. "
 HUN_strengthen_the_rome_protocols:0 "Strengthen The Rome Protocols"
 HUN_strengthen_the_rome_protocols_desc:0 "In 1934, Italy, Austria and Hungary agreed on geopolitical, and economic cooperation. The agreement was not a binding alliance, but we could pursue closer ties with Italy based on the original protocols."
 HUN_armament_agreement:0 "Armament Agreement"
 HUN_armament_agreement_desc:0 "Italy is in many respects ahead of us in her military potential. If we want to regain lost territory, our armament needs to be sped up, with foreign aid if necessary. To this end, we should seek the attention of Italian companies and investors, and offer them opportunities in Hungary."
 HUN_the_badoglio_plan:0 "Badoglio Plan"
 HUN_the_badoglio_plan_desc:0 "Yugoslavia owes its creation to the Trianon peace dictatorship. With the involvement of our new allies, the time has come to transform the borders to better suit us."
 HUN_countryside_development:0 "Countryside Development"
 HUN_countryside_development_desc:0 "We can not let the capital become our only source of industrial capacity. By dispersing factories all over the countryside, we will always have a sufficient amount of industry, that we can tap into if we need to."
 HUN_elite_cavalry_division:0 "Cavalry Divisions"
 HUN_elite_cavalry_division_desc:0 "The once famous Hungarian cavalry could use some modernization. We will recruit an elite division of cavalry and armored units, which will retain the imagery of the Hungarian hussars, while still being an effective force on the battlefield."
 HUN_reassert_old_claims:0 "Reassert Old Claims"
 HUN_reassert_old_claims_desc:0 "It is bad enough that the Allies have ignored the reasonable request of Albert Apponyi at the Treaty of Versailles, to limit the territorial losses of Hungary, since then, the world seems to have forgotten that our country was once one of the greatest in the region. The historical territory of the Kingdom of Hungary has to be restored, thus, we are openly announcing our claims on the lost provinces."
 HUN_claim_fiume:0 "Claim Fiume"
 HUN_claim_fiume_desc:0 "The port of Fiume was contested even in the times of the Austro-Hungarian Monarchy, but it has now come under the occupation of Italy. It is rightfully ours, but the Italians would never agree to just hand it over. We need to apply more than just diplomatic pressure if we want to take it."
 HUN_demand_slovakia:0 "Demand Slovakia"
 HUN_demand_slovakia_desc:0 "Slovakia - or Czechoslovakia for that matter - isn't and never was a viable country. It is merely a construct of Trianon, and as such, is not recognised by the new Hungarian government. Czechoslovakia will cede all territories in question, or we take it by force. The threat of losing their entire country might be enough to let go of half of it."
 HUN_yugoslavian_pact_of_eternal_friendship:0 "Yugoslavian Treaty Of Eternal Friendship"
 HUN_yugoslavian_pact_of_eternal_friendship_desc:0 "Even though Yugoslavia holds provinces that should be ours, they would make a great ally, if we were to oppose Germany. They foster good relations with the allies, and are unlikely to submit to German pressure. We should settle relations between our countries, and sign a pact of 'Eternal Friendship', which would pave the way for further cooperation."
 HUN_partition_yugoslavia:0 "Partition Yugoslavia"
 HUN_partition_yugoslavia_desc:0 "This monstrosity of a country called Yugoslavia is yet another ugly product of the peace treaties after the Great War. If we can gain enough influence in the area, or convice some major powers to back us, we could arrange for a repartition of the Yugoslavian territory."
 HUN_partition_romania_with_the_ussr:0 "Partition Romania With The USSR"
 HUN_partition_romania_with_the_ussr_desc:0 "It is no secret, that the Soviets have ambitions to lay their hands on Bessarabia, just as we want to claim Transylvania. With careful negotiation, we could strike a deal with them, to attack Romania from two sides, and help each other achieve our goals."
 HUN_demand_transylvania_focus:0 "Demand Transylvania"
 HUN_demand_transylvania_focus_desc:0 "Transylvania, one of the oldest core parts of our country was wrongly assumed to be rightfully Romanian land, and shall be ceded to our glorious country immediately. If the Romanian government decides to hold on to it, we might just take it by force, and while we're at it, we can conquer the rest of their country."
 HUN_threaten_war_for_banat:0 "Threaten War For Banat"
 HUN_threaten_war_for_banat_desc:0 "Although Banat is not primarily inhabited by Hungarians, it would be strategically beneficial to acquire it, as it makes our southern borders excessively long. Romania is now weak enough, that they might give in to just about any demands we make, and we should use this to our advantage. We will threaten to declare war on them, if they don't draw their forces back from Banat."
 HUN_croatian_ports:0 "Croatian Ports"
 HUN_croatian_ports_desc:0 "Having been landlocked for decades, our experience with naval affairs has detoriated somewhat. To help reestablish ourselves on the sea, we need to start expanding our naval capacity. The adriatic ports of Croatia all have room for improvement, and with a little effort, could turn into viable naval bases."
 HUN_metal_processing_in_vojvodina:0 "Metal Processing In Vojvodina"
 HUN_metal_processing_in_vojvodina_desc:0 "The province of Backa is one of the least likely to be attacked, and thus serves a strategic role in developing our industry. The metal industry has always been present in the area, though on a smaller scale, still the province is ideal for a military-industrial complex."
 HUN_croatian_smelting_industry:0 "Develop The Croatian Smelting Industry"
 HUN_croatian_smelting_industry_desc:0 "Croatia has vast amounts of resources, that are not properly utilized. Developing the smelting industry in Croatia and Slavonia would enable us to make better use of the bauxite and iron in the area."
 HUN_coal_mines_in_nyitra:0 "Coal Mines In Nyitra"
 HUN_coal_mines_in_nyitra_desc:0 "Now that Nyitra is back in our hands, the coal mining industry can be expanded, and new factories can be supplied with the resources."
 HUN_mines_in_transylvania:0 "Mines In Transylvania"
 HUN_mines_in_transylvania_desc:0 "The many mountains of Transylvania are rich in resources such as iron, gold, copper, and salt. Expanding the mining network in the area will boost the industrial capacity of our nation, and aid our efforts."
 HUN_concentric_road_network:0 "Concentric Road Network"
 HUN_concentric_road_network_desc:0 "With all the territory reunited, the need for a proper network of transportation arose. Establishing a circle of high throughput roads in the new provinces can help ease the burden on the local roads. The current road network, which has Budapest at its centre, would tie in at important hotspots to this circular design."
 HUN_settle_the_matter_of_the_monarchy:0 "Settle The Matter Of The Monarchy"
 HUN_settle_the_matter_of_the_monarchy_desc:0 "Our country has been without a king, ever since the end of the Great War, yet we call ourselves a kingdom. We need to address this issue, and resolve it one way or the other."
 HUN_restore_the_constitutional_monarchy:0 "Restore Constitutional Monarchy"
 HUN_restore_the_constitutional_monarchy_desc:0 "During the years of the dual monarchy with Austria, the king had the final authority in important matters, while the parliament operated independently of him. We should bring back the old system, and elect a king to be in charge of the country."
 HUN_form_a_parliamentary_monarchy:0 "Form A parliamentary Monarchy"
 HUN_form_a_parliamentary_monarchy_desc:0 "The age of absolute rulership of monarchs is gone. If we are to restore the monarchy, it should be as a parliamentary one, where the monarch does not hold power over the parliament, and only performs the tasks of a head of state."
 HUN_albrecht_franz_habsburg_of_teschen:0 "Albrecht Franz von Habsburg-Teschen"
 HUN_albrecht_franz_habsburg_of_teschen_desc:0 "Albrecht Franz is a distant relative of the last ruling branch of the monarchy, but has close ties to Hungary. He could make an ideal king, with nationalistic motivations, and potential support for a right-wing regime in Hungary."
 HUN_otto_von_habsburg:0 "Otto von Habsburg"
 HUN_otto_von_habsburg_desc:0 "The monarchy is now stable, and there is decent support for a legitimist movement. Otto von Habsburg is the rightful heir to the throne of Hungary, and as such, shall be reinstated as king. Some might be worried about the return of a Habsburg, but Otto is not his grandfather, and he will surely bring peace and prosperity to our country."
 HUN_edward_of_windsor:0 "Edward of Windsor"
 HUN_edward_of_windsor_desc:0 "We could use the election of a new king to build international connections. The British ruling dynasty has plenty of relatives to spare, and having the same house leading our countries would no doubt improve relations between our countries. Edward, son of Goeorge V would make an excellent king for Hungary."
 HUN_carl_wilhelm_of_sweden:0 "Carl Wilhelm of Sweden"
 HUN_carl_wilhelm_of_sweden_desc:0 "Perhaps choosing a monarch of an influential power would endanger the country's neutrality. We could be better off with the king of a notoriously neutral country, like Sweden. The second son of the king, Carl Wilhelm would make for an excellent candidate, and good relations with Sweden could bring other benefits as well."
 HUN_reinforce_the_regency:0 "Reinforce The Regency"
 HUN_reinforce_the_regency_desc:0 "Miklós Horthy wields most of the actual power in the country, but the parliament still operates independently of the regent. We must restore authority to the head of the state, and reassure his position as our nation's leader."
 HUN_enthrone_horthy:0 "Enthrone Horthy"
 HUN_enthrone_horthy_desc:0 "Horthy is practically reigning as a king now, in all but name. There are plenty of people, who support his coronation, and having a king again, would certainly lift the spirits of the nation."
 HUN_choose_a_successor_for_horthy:0 "Choose A Successor For Horthy"
 HUN_choose_a_successor_for_horthy_desc:0 "Horthy has served our country well as a regent, but his old age has many worried. We should choose a successor for him while he is still alive, so that the government doesn't fall into disarray in the case of his death."
 HUN_dismantle_the_monarchy:0 "Dismantle The Monarchy"
 HUN_dismantle_the_monarchy_desc:0 "We have had enough of the authoritarian rulership of kings and regents. The monarchy is outdated and obsolete. We will decide upon a new form of government, where the head of state wields less authority, and the true power will be given to the people."
 HUN_agricultural_modernisation:0 "Agricultural Modernisation"
 HUN_agricultural_modernisation_desc:0 "Agriculture is, and always has been the primary economic driving force of our country. We can't let this branch of industry deteriorate, if we hope to make advancements in any other field."
 HUN_found_maort:0 "Found MAORT"
 HUN_found_maort_desc:0 "Some American businessmen have funded a prospecting expedition in our country, and found considerable amounts of oil near the villages of Lovászi and Hahót. They proposed the creation of a joint company, under the name MAORT (Magyar-Amerikai Olajipari Rt.), which would operate in the area. Most of the oil would end up in our hands, so there is little to lose."
 HUN_expand_the_wm_steel_plant:0 "Expand The Manfred Weiss Steel Works"
 HUN_expand_the_wm_steel_plant_desc:0 "Manfred Weiss Steel Works is one of the largest steel foundries in Hungary. If we want to increase our military in preparation for the next war, we need to significantly increase our steel production."
 HUN_expand_the_wm_aluminium_plant:0 "Expand The Aluminium Industry"
 HUN_expand_the_wm_aluminium_plant_desc:0 "We require all available resources, both for export and for domestic use. Our aluminium industry, though already expansive, has further room for improvement, and we should direct resources to this end immediately."
 HUN_expand_the_agrarian_industry:0 "Expand The Agrarian Industry"
 HUN_expand_the_agrarian_industry_desc:0 "With the state-subsidised expansion of smaller plants ( Holtz, Uhry...etc), we can significantly increase the country's industrial capacity."
 HUN_synthetic_rubber:0 "Synthetic Rubber"
 HUN_synthetic_rubber_desc:0 "The rubber industry is the jewel of our economy, but it is highly dependent on raw materials imported from abroad. In order to eliminate this, it is necessary to introduce a new technological process with which we can eliminate our dependence on raw materials and rely on the use of completely domestic raw materials."
 HUN_oil_surveys:0 "Oil Surveys"
 HUN_oil_surveys_desc:0 "Signs of oil fields have been found in Slovakia and Backa. We have to conduct a through survey and chart any unexploited oil reserves in these areas."
 HUN_expand_the_rubber_industry:0 "Expand the Transdanubian Rubber Industry"
 HUN_expand_the_rubber_industry_desc:0 "The rubber industry has been present in Hungary for some time, and even though it fully relies on imports, it might be advantageous to expand it. Doing so would provide us with more industrial capacity, and a steadier influx of rubber."
 HUN_fortification_effort:0 "Fortification Effort"
 HUN_fortification_effort_desc:0 "The borders of our country have to be properly prepared for an invasion. A well fortified line can be worth more than a dozen divisions."
 HUN_industrial_effort:0 "Industrial Effort"
 HUN_industrial_effort_desc:0 "If we hope to match the industrial capacity of major powers, we must concentrate on developing our industry as hard as we can. With a large enough industry, we will be able to afford a war effort comparable to any world power."
 HUN_gyor_arms_factory:0 "Györ Arms Factory"
 HUN_gyor_arms_factory_desc:0 "Györ is located at a strategically important position. Developing the arms manufacturing industry in the city would enable a fast and steady supply of arms, that could quickly reach the border."
 HUN_miskolc_arms_factory:0 "Miskolc Arms Factory"
 HUN_miskolc_arms_factory_desc:0 "Miskolc is located at a strategically important position, near the northern border. Developing the arms manufacturing industry in the city would enable a fast and steady supply of arms, that could quickly reach the frontlines."
 HUN_artillery_factory_in_szeged:0 "Artillery Factory In Szeged"
 HUN_artillery_factory_in_szeged_desc:0 "Artillery is an essential part of any division. Our country still lacks a proper line of production for the equipment used by artillery units, but a small arms factory in Szeged could be expanded to facilitate a new production line dedicated to artillery."
 HUN_artillery_factory_in_gyor:0 "Artillery Factory In Györ"
 HUN_artillery_factory_in_gyor_desc:0 "Before the end of the Great War, there was an artillery factory in Györ, which was pillaged, and essentially destroyed by the occupying Romanians in 1919. Its strategic position still makes Györ an ideal place for a factory, so we should make a concentrated effort to rebuild it."
 HUN_budapest_ferihegy_airport:0 "Budapest Ferihegy Airport"
 HUN_budapest_ferihegy_airport_desc:0 "Our capital is yet to have a proper airport built. Constructing a world class international airport would also enable us to further our aviation goals, and attach facilities necessary for the construction and reparation of planes."
 HUN_hungarian_lloyd_aircraft_factory:0 "Hungarian Lloyd Aircraft Factory"
 HUN_hungarian_lloyd_aircraft_factory_desc:0 "The original Lloyd Aircraft Factory was torn down after the Great War, as Hungary was forbidden to manufacture airplanes. Now this restriction can no longer be enforced, and we are free to reconstruct the factory, and begin producing military aircraft again."
 HUN_transdanubian_construction_grants:0 "Transdanubian Construction Grants"
 HUN_transdanubian_construction_grants_desc:0 "The Transdanubian industry could use a little development. We could indirectly infulence the matter by granting benefits to industrial companies, that are willing to settle in the region."
 HUN_the_debrecen_industrial_concern:0 "The Debrecen Industrial Concern"
 HUN_the_debrecen_industrial_concern_desc:0 "Eastern regions of the country are underdeveloped in comparison to the west. Boosting the local industry might provide the swing necessary to revitalize the area."
 HUN_budapest_industrial_district:0 "Budapest Industrial District"
 HUN_budapest_industrial_district_desc:0 "There are vast unused spaces on the borders of Budapest. Designating one of these to be an industrial district would not only create jobs for residents of the city, but also boost our industrial capacity."
 HUN_land_clearance:0 "Land Clearance"
 HUN_land_clearance_desc:0 "Some forested areas are limiting the expansion of our industry, and road networks. Deforesting these lands would provide some temporary jobs, and free up loads of space for our industry to expand to."
 HUN_hungarian_motorway_network:0 "Hungarian Motorway Network"
 HUN_hungarian_motorway_network_desc:0 "After the rise of indutrial activity throughout the country, the current road network is overburdened. It is time to lay the groundwork for a country-wide network of motorways, that connects all major cities and industrial hubs to the capital, Budapest. This network will also provide some extra room for industrial expansion, as the roads link up major settlements."
 HUN_industrial_research_projects:0 "Industrial Research Projects"
 HUN_industrial_research_projects_desc:0 "Through the expansion of industry, we can rally the greatest engineers and scientists of our country to put their minds to better use, and improve our research capacities."
 HUN_the_gyori_program:0 "The Györi Program"
 HUN_the_gyori_program_desc:0 "Due to restrictions set by the Allies of the Great War during the peace treaties, our army is now the laughing stock of Europe. We need to make preparations for an intensive armament and development program."
 HUN_hungarian_uranium:0 "Hungarian Uranium"
 HUN_hungarian_uranium_desc:0 "We can speed up our own nuclear programs by accelerating the uranium deposit discovered in the Mecsek Mountains, and we can also speed up the construction of atomic reactors by using domestic raw materials."
 HUN_post_war_reorganisation:0 "No, No! Never!"
 HUN_post_war_reorganisation_desc:0 "Now that we have had our fair share of fights, some promotions are in order for both veteran, and newfound officers of our army. Those who distinguished themsleves on the battlefield, will be rewarded with high offices of command."
 HUN_invite_foreign_military_mission:0 "Invite Foreign Military Mission"
 HUN_invite_foreign_military_mission_desc:0 "We should not only strive to improve our military leadership from the inside, but also look for help from the outside. Some of our allies have experienced military advisors, that could be invited to aid us via a military mission."
 HUN_aviation_effort:0 "Aviation Effort"
 HUN_aviation_effort_desc:0 "Our air force is in a dire condition. No major factories have been dedicated to building planes, and training routines are outdated. An airplane factory will be constructed near Budapest, and a team of experts will be assigned the task of developing new tactics and training drills."
 HUN_the_aerotechnics_institute:0 "The Aerotechnics Institute"
 HUN_the_aerotechnics_institute_desc:0 "The Aerotechnics Institute of the Budapest University of Technology has so far proven useful in the development of experimental airplanes. With the necessary funding, the institute could be made into the primary research establishment for our air force."
 HUN_air_superiority_focus:0 "Air Superiority Focus"
 HUN_air_superiority_focus_desc:0 "As a small country, it is vital, that we defend our airspace as well as possible, and thus, fighters and battlefield support should be our priority. Should we fail to gain the advantage in the air, our ground forces will surely fail."
 HUN_fighter_production_innovations:0 "Fighter Production Innovations"
 HUN_fighter_production_innovations_desc:0 "Perhaps assigning our entire industry to the production of fighters is not the smartest way of going about creating the large air force we desire. If we could make some progress towards production innovations, we could build smarter, instead of harder."
 HUN_targeted_destruction_focus:0 "Targeted Destruction Focus"
 HUN_targeted_destruction_focus_desc:0 "With our current industrial capacity, we cannot hope to outmatch any of the major powers' air forces with fighters. We could however try to do as much damage as we can, focusing on strategically targeting points of interest, and only gain air superiority for as long as we have to."
 HUN_bomber_production_innovations:0 "Bomber Production Innovations"
 HUN_bomber_production_innovations_desc:0 "The production of bombers is taking up way too much of our industrial capacity. If we could make their production more efficient, we would be able to assign factories elsewhere, and still keep up with the same bomber production."
 HUN_military_intelligence:0 "Heavy Fighters"
 HUN_military_intelligence_desc:0 "Fighters, but heavy!"
 HUN_the_bay_group:0 "The Bay-Group"
 HUN_the_bay_group_desc:0 "A group led by Zoltán Bay, a prominent physicist in our country, has made remarkable advancements in radiolocation. With enough funding, they could cover most of the country with a state-of-the-art radar network, which would significantly help our air-defence."
 HUN_jet_propulsion:0 "Jet Propulsion"
 HUN_jet_propulsion_desc:0 "Some of our scientists have made breakthroughs towards the ultimate aerial tool: the jet engine. If the project would get further funding, jet engines could be used as the drive of our newest planes, which could in turn achieve never before seen velocities."
 HUN_army_effort:0 "Army Effort"
 HUN_army_effort_desc:0 "The restructuring of the military needs to be taken to the next level. New officials will be appointed, and new recruits will be given more training before being fielded. The military research department has also been assigned work on advancing our doctrine research."
 HUN_advanced_infantry_divisions:0 "Advanced Infantry Divisions"
 HUN_advanced_infantry_divisions_desc:0 "Infantry is the backbone of any army. To excel in any other field, we first have to make sure, that our infantry is equipped and supported appropriately."
 HUN_specialised_training:0 "Specialised Training"
 HUN_specialised_training_desc:0 "Basic infantry is well suited for most applications, but at times, special forces like mountaineers, or marines can provide the edge against an enemy. A small training facility could be established to suit the requirements of such divisions."
 HUN_saint_ladislaus_paratrooper_division:0 "Saint Ladislaus Paratrooper Division"
 HUN_saint_ladislaus_paratrooper_division_desc:0 "Other countries have been successfully using paratrooper units for quite some time, and we have been lagging behind in this aspect. We have to make a dedicated effort to establish paratrooper divisions of our own, which shall be called Saint Ladislaus, after our famous king from the medieval ages. The unit will be provided with the necessary equipment and funding, so that training can start right away."
 HUN_szekely_mountaineers:0 "Szekler Mountaineers"
 HUN_szekely_mountaineers_desc:0 "Once we get hold of Transylvania, we can utilize the Carpathian mountains, as an easily defendable line. The local Szekler population knows these mountains well, and some of them could be drafted into specialized 'hegyivadász' divisions."
 HUN_motorization_effort:0 "Motorization Effort"
 HUN_motorization_effort_desc:0 "Cavalry is slowly dying out in armies across the world. It may still be useful for peacekeeping purposes, but the future of fast warfare is in motorized divisions. We have to dedicate a significant amount of time to this matter, if we wish to keep up with the rest of the world."
 HUN_project_toldi:0 "Project Toldi"
 HUN_project_toldi_desc:0 "Our country might not be suited for mass production of heavily armored vehicles, but we could probably afford to invest in lighter variants. A proposed armored vehicle named 'Toldi' after the medieval knight Miklós Toldi, could serve as an invaluable support unit to our existing army."
 HUN_advanced_doctrines:0 "Light Jäger Infantry"
 HUN_advanced_doctrines_desc:0 "Sheer force is not enough to win a war. Our generals have to be informed, and versed in the most modern of tactics if we wish to excel on the battlefield."
 HUN_swedish_license_trade:0 "Swedish License Trade"
 HUN_swedish_license_trade_desc:0 "The Swedish, though intent on staying out of global conflicts, are happy to supply others with military designs. They have made some noticeable advancements in artillery, and armored vehicles. We could try to buy some of their licenses and make advancements of our own without having to invest more in research."
 HUN_german_license_trade:0 "German License Trade"
 HUN_german_license_trade_desc:0 "Our research effort can't effectively cover all areas of warfare, and thus, we have to rely on foreign technology to some exntent at least. Germany has recently developed some excellent fighters, and light aeroplanes, which we could certainly use in our own air force. Striking a business deal with them would further our aviation effort, without any significant investment."
 HUN_revive_the_navy:0 "Revive The Navy"
 HUN_revive_the_navy_desc:0 "Being landlocked has taken its toll on the maritime traditions of the country. The revival of the navy has to start with construction of the appropriate facilites, like dockyards, and ports. After we have a solid base for our navy, we can start thinking about the tactical, and practical."
 HUN_reinstate_horthy:0 "Reinstate Horthy"
 HUN_reinstate_horthy_desc:0 "Miklós Horthy was the rear-admiral of the Hungarian navy, back when it was still a thing. Since the country became landlocked, he assumed the position of regent of the country. Some would say that his political background may compromise his position in the navy, but his skills as an admiral are unquestionable."
 HUN_screen_effort:0 "Screen Effort"
 HUN_screen_effort_desc:0 "The foundations of the navy are destroyers. No battleship, or cruiser can withstand the attack of a well equipped fleet alone, it needs the support of destroyers and smaller cruisers."
 HUN_heavy_ship_effort:0 "Heavy Ship Effort"
 HUN_heavy_ship_effort_desc:0 "A fleet of destroyers is good. A fleet of destroyers surrounding a few battleships and cruisers is even better. We should focus on diversifying our fleet, and producing ships for all tasks and uses."
 HUN_naval_defense:0 "Naval Defense"
 HUN_naval_defense_desc:0 "Not having had a coastline for decades, it might come as a surprise, that our country can be invaded by sea. To avoid such disastrous events, we should construct coastal defenses wherever we can."
 HUN_amphibious_operations:0 "Amphibious Operations"
 HUN_amphibious_operations_desc:0 "Now that defense is taken care of, we can offense as an option. It is very much possible, that we get into a situation, where we have to perform an amphibious assault, and preparing for that is no easy task. Therefore, we shall forego these troubles, and start the preparations early."
 HUN_ubag:0 "UBAG"
 HUN_ubag_desc:0 "UBAG was a submarine factory in Fiume during the Great War, that produced submarines for the Austro-Hungarian Monarhcy. If we want to kickstart the submarine production of the new Hungarian navy, we should revive this factory, and use any old plans that we can still get our hands on."
 HUN_escort_fleet:0 "Convoy Tactics"
 HUN_escort_fleet_desc:0 "By introducing new tactics to protect convoys, we can make our maritime transport more efficient and safer at the same time."
 HUN_raiding_fleet:0 "Submarine Tactics"
 HUN_raiding_fleet_desc:0 "With modern combat procedures developed for our new submarines, we can fight enemy fleets much more effectively."
 HUN_expand_the_ganz:0 "Expand The Ganz"
 HUN_expand_the_ganz_desc:0 "With the expansion of the Ganz shipyard and the introduction of new production technologies, we can significantly increase the size of our fleet, and at the same time accelerate the production of ships."
 HUN_naval_tactical_advancements:0 "Naval Tactical Advancements"
 HUN_naval_tactical_advancements_desc:0 "Admirals are not easily found in the country. This also creates an opportunity, to train young, freshly graduated admirals to suit our needs, and follow a specific doctrine."
 HUN_organize_military_research_branch:0 "Organize Military Research Branch"
 HUN_organize_military_research_branch_desc:0 "With all of the advancements in military fields, new engineers and scientists have surfaced, who have proven to be valuable additions to our research efforts. We can now dedicate more people to this cause, than ever before."
 HUN_nuclear_technology:0 "Nuclear Technology"
 HUN_nuclear_technology_desc:0 "Hungarian scientist Leó Szilárd has already conceived the idea of nuclear chain reaction in 1933. The time has come to further develop his concepts, and put the technology to good use."
 HUN_secret_weapons:0 "Secret Weapons"
 HUN_secret_weapons_desc:0 "With advancements in rocketry and nuclear technology, the way is open towards the warfare of the future. Nukes and remote controlled projectiles can be just as effective (if not more) as aerial bombings."
 HUN_secret_rearmament_focus:0 "Secret Rearmament"
 HUN_secret_rearmament_focus_desc:0 "Though we are obliged to obey the restrictions set by the Treaty of Trianon, we should still not neglect the defence of our country. The army will be re-armed in secret until such time that we can reveal our efforts again."
 HUN_bled_agreement_focus:0 "Bled Agreement"
 HUN_bled_agreement_focus_desc:0 "With the increased threat to the peace of Europe, we can no longer idly tolerate the shackles of the Trianon peace treaty. Surely, the members of the Little Entente will recognize, that Hungary needs to rearm herself, otherwise it will fall to foreign expansion, exposing their borders too. We will meet their representatives to discuss lightening the restrictions."
 HUN_local_intelligence_training:0 "Local Intelligence Training"
 HUN_local_intelligence_training_desc:0 "Our intelligence agency is far behind those of other European powers. We need to expand our own training programs, to be less reliant on foreign aid for our espionage developments. Openly funneling our resources into espionage will no doubt cause suspicion among our neighbors and enemies, but we can't place diplomatic relations above the integrity of our country."
 HUN_expand_vkf_2_non_communist:0 "Expand The VKF-2"
 HUN_expand_vkf_2_non_communist_desc:0 "The VKF-2 agency has been the backbone of our intelligence and counter-intelligence efforts so far. It would require additional funds to expand its operational capabilities, which would in turn slow down some of our other projects. Surely this is a sacrifice worth making, if we weigh the drawbacks against the safety of the homeland."
 HUN_expand_the_avh_communist:0 "Expand the ÁVH"
 HUN_expand_the_avh_communist_desc:0 "The ÁVH agency has been the backbone of our intelligence and counter-intelligence efforts ever since its conception. It would require additional funds to expand its operational capabilities, which would in turn slow down some of our other projects. Surely this is a sacrifice worth making, if we weigh the drawbacks against the safety of socialism and the homeland."
 HUN_state_defense_center:0 "State Defense Center"
 HUN_state_defense_center_desc:0 "By merging military intelligence and various political investigation teams, we can create a new, more efficient organization. With this new organization, we can act more effectively against various subversive activities."
 HUN_huba_order_of_battle:0 "Huba Order Of Battle"
 HUN_huba_order_of_battle_desc:0 "In addition to the launch of the Gyôri Program, we also need to initiate a thorough military reform to achieve our goals. The reformation of the Army will be implemented under the Huba order of battle."
 HUN_rapid_corps: "Rapid Corps"
 HUN_rapid_corps_desc:0 "A key component of the Huba Order of Battle is the motorization of the army. This will be achieved by setting up the Rapid Corps, and expanding the army's mechanized units."
 HUN_expand_the_rapid_corps:0 "Expand The Rapid Corps"
 HUN_expand_the_rapid_corps_desc:0 "To properly utilize our mechanized troops, we will need to adapt armored units. We shall set up the army's first armored corps under the Huba Order of Battle."
 HUN_improve_the_huba_order_of_battle:0 "Improve The Huba Order Of Battle"
 HUN_improve_the_huba_order_of_battle_desc:0 "Our orders of battle have to be adjusted, to meet needs that have arisen since their inception. The original plans have somewhat neglected the role of the air force, which needs to have a larger role in our strategies."
 HUN_danuvia_heavy_submachine_guns:0 "Danuvia Heavy Submachine Guns"
 HUN_danuvia_heavy_submachine_guns_desc:0 "Ferenc Gaubber, and Pál Király - the deisgner of the well known Danuvia 43M submachine gun - have come forward with a proposition to design and manufacture a heavier machine gun, that the army could employ."
 HUN_alfold_oil_fields:0 "Alföld Oil Fields"
 HUN_alfold_oil_fields_desc:0 "The existing oil production in the Alföld plains is not adequate for our needs. With some investment, the refineries could be fitted for synthetic production, as well as natural oil refinement."
 HUN_occupation_troops:0 "Occupation Troops"
 HUN_occupation_troops_desc:0 "To ensure the supply and defence of occupied territories, we need to create and equip the appropriate units. These units will perform the construction of roads, bridges and railways in the newly occupied territories."
 HUN_the_second_army:0 "The Second Army"
 HUN_the_second_army_desc:0 "Due to the increased demands of the war against Soviet Union a new army must be created and sent to the front. For this, we will need to tap into our reserves, and mobilize most of our conscripts."
 HUN_blitzkrieg_adoption:0 "Blitzkrieg Adoption"
 HUN_blitzkrieg_adoption_desc:0 "The age of mobile warfare is upon us. If we want to excel on the battlefield, we need to adapt the Blitzkrieg tactics of Germany."
 HUN_italian_pilot_training:0 "Italian Pilot Training"
 HUN_italian_pilot_training_desc:0 "Italy will help in the training of pilots, while our aviation leadership will have the opportunity to learn new tactics."
 HUN_hungarian_german_aircraft_manufacturing:0 "Hungarian-German Aircraft Manufacturing"
 HUN_hungarian_german_aircraft_manufacturing_desc:0 "As part of the German effort to disperse their industry, they allowed us the right to purchase the license of the Me-210 and helped us set up a manufacturing plant at the Danube Aircraft Factory."
 HUN_expand_the_danube_aircraft_factory:0 "Expand The Danube Aircraft Factory"
 HUN_expand_the_danube_aircraft_factory_desc:0 "The Air Force is in great need of modern airplanes, so increasing the production of all manufacturing plants is vital to the expansion of our Air Force."
 HUN_kossuth_order_of_battle:0 "Kossuth Order Of Battle"
 HUN_kossuth_order_of_battle_desc:0 "Though we may lack the manpower of the Soviet Union, their fighting techniques might still be used by our armies to efficiently utilize our troops."
 HUN_tank_developments:0 "Tank Developments"
 HUN_tank_developments_desc:0 "The Soviet Union has accumulated plenty of experience developing and manufacturing tanks, which we can use to advance our own research efforts."
 HUN_assault_guns_focus:0 "Assault Gun Focus" 
 HUN_assault_guns_focus_desc:0 " The self-propelled artillery, can move along with the armored units, providing supporting fire wherever needed. The standardization of manufacturing processes can increase the production of these units." 
 HUN_pilis_order_of_battle:0 "Pilis Order Of Battle"
 HUN_pilis_order_of_battle_desc:0 "Our armies should follow the western pattern, and we will do our best to equip them accordingly."
 HUN_french_connection:0 "French Connection"
 HUN_french_connection_desc:0 "France offered an opportunity to train officers in their own institutions. Our pilots and cavalry officers can train in french institutions to gain access to the newest tactics that they can offer."
 HUN_expand_the_raba:0 "Expand The Raba"
 HUN_expand_the_raba_desc:0 "RÁBA is an important producer of military equipment and vehicles. In order to field troops faster, we need to support the expansion of this company."
 HUN_naval_tradition:0 "Naval Tradition"
 HUN_naval_tradition_desc:0 "The navy of the Austro-Hungarian monarchy performed excellently in the previous war. If we want to preserve the accomplishments of the past, we need to invest in the progression our navy." 
 HUN_war_games_focus:0 "War Games"
 HUN_war_games_focus_desc:0 "To improve the cohesion of our new army, we need to drill them through military excercises regularly."
 HUN_the_kuk_army:0 "The K.u.K. Army"
 HUN_the_kuk_army_desc:0 "If we are to efficiently admiister the regained territories of the Monarchy, we need to introduce a new conscription system, that allows us to keep a healthy manpower reserve."
 HUN_rebuild_the_navy:0 "Rebuild The Navy"
 HUN_rebuild_the_navy_desc:0 "A new shipyard shall be established in Istria, to increase our naval production. With the additional production, we should have an easier time keeping up with the navies of surrounding powers."
 HUN_infantry_tactics:0 "Infantry Tactics"
 HUN_infantry_tactics_desc:0 "Our studies in the various fields of warfare have yielded fruit. We now have the means to develop the best infantry tactics that we can possibly achieve."
 HUN_armoured_tactics:0 "Armoured Tactics"
 HUN_armoured_tactics_desc:0 "The future is armoured warfare, so we can ensure the superiority of our armoured troops on the battlefield, by introducing new combat procedures."
 HUN_ground_support_tactics:0 "Flying Artillery"
 HUN_ground_support_tactics_desc:0 "The Air Force is the artillery of modern warfare, that can be deployed anywhere, anytime, to destroy enemy forces."
 HUN_proclaim_greater_hungary:0 "Proclaim Greater Hungary"
 HUN_proclaim_greater_hungary_desc:0 "After we regained the territories we deserved, the size of our country grew to its historical limits. Now we can proclaim the formation of Greater Hungary to the world with full confidence, and set new goals before our eyes."
 HUN_archduke_joseph_franz:0 "Turanist King"
 HUN_archduke_joseph_franz_desc:0 "We need a king loyal to our country, who can set a new direction in diplomatic relations. The most suitable person for this is the eldest son of Archduke Joseph August of Habsburg-Lorraine, Archduke Franz Joseph, who remained in Hungary even after the break-up of the Monarchy and is a committed supporter of Turanic relations."
 HUN_turani_relation:0 "Turanic Connections"
 HUN_turani_relation_desc:0 "Nationally, scientifically and economically to the east! The Hungarian nation has a great and bright future ahead of it, and it is certain that after the heyday of Germanism and Slavism, Turanism will flourish. The great and difficult, but glorious task of becoming the spiritual and economic leaders of six hundred million Turanians is waiting for us Hungarians, the Western representatives of this huge emerging power."
 HUN_red_army:0 "Red Army"
 HUN_red_army_desc:0 "After the Great War, many Hungarians chose the Soviet Union as their new homeland, including well-trained military officers. With their call home, we can replenish our army with well-trained officers loyal to the new system."
