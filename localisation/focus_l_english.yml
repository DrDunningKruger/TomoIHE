 USA_second_vinson_act:0 "Second Vinson Act"
 USA_second_vinson_act_desc:0 "The Second Vinson Act, passed in 1938, provides for a significant expansion of our military capabilities. We must use this opportunity to build up our armed forces and prepare for the challenges ahead."
 USA_naval_expansion_act:0 "Naval Expansion Act"
 USA_naval_expansion_act_desc:0 "With the world on the brink of war, it is imperative that we secure our naval dominance. The Naval Expansion Act, passed on June 14, 1940, authorizes the construction of new ships and the expansion of our naval bases."
 USA_emergency_shipbuilding:0 "Emergency Shipbuilding Program"
 USA_emergency_shipbuilding_desc:0 "The Emergency Shipbuilding Program will allow us to rapidly expand our naval fleet, creating more jobs and ensuring our maritime security. With this program, we will be able to comission new modern ships and repair existing ones, utilizing state of the art techniques to increase our dockyard efficiency and output."
 USA_carrier_warfare:0 "Carrier Warfare Experiments"
 USA_carrier_warfare_desc:0 "Our success in the future naval warfare will depend on our ability to adapt quickly to changing situations, so we must be prepared to innovate and experiment constantly. By conducting carrier warfare experiments, we will gain invaluable knowledge on how to best utilize this new type of weapon in battle."
 USA_advanced_damage_control:0 "Damage Control"
 USA_advanced_damage_control_desc:0 "In the face of the growing naval conflict, it is vital to ensure the survival of our ships on the front lines. By investing in our Naval Damage Control program, we can better train our sailors to respond to damage and keep our ships afloat in the heat of battle."
 USA_cruiser_effort:0 "Cruiser Modernization"
 USA_cruiser_effort_desc:0 "With tensions rising across the globe, our navy must remain vigilant and prepared. To bolster our naval capabilities, we will undertake a modernization program to upgrade and develop new cruisers. Through advanced research and development, our naval engineers will create cutting-edge designs with enhanced firepower, speed, and protection. With these new cruisers, we will maintain our dominance over the seas and protect American interests abroad."
 USA_amtracks:0 "Amphibious Assault Vehicles"
 USA_amtracks_desc:0 "With the need for successful amphibious assaults in mind, we will prioritize the development and production of Amtrack vehicles, capable of delivering troops and supplies from ships to shore."
 USA_island_hopping:0 "Island Hopping"
 USA_island_hopping_desc:0 "With the Pacific War in full swing, it is clear that a direct assault on the Japanese home islands would be a costly and risky endeavor. Therefore, we must adopt a new strategy that aims to bypass heavily fortified Japanese strongholds and seize key strategic points across the Pacific."
 USA_fire_control:0"Improved Fire Control"
 USA_fire_control_desc:0"As we expand our naval capabilities, we must also improve our ability to accurately and effectively engage enemy vessels. This focus will allocate resources towards the development of new naval fire control systems, allowing us to better coordinate our guns and increase our accuracy in naval combat."
 USA_escort_planes:0 "Escort Fighters"
 USA_escort_planes_desc:0 "As the war rages on, we must ensure our bombers can strike enemy targets with impunity. To achieve this, we will initiate the Escort Fighter Program to develop specialized fighters tasked with protecting our bombers. "
