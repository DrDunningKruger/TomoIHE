 GER_ardennesoffensive:0 "The Ardennes Offensive"
 GER_ardennesoffensive_desc:0 "We did it in 1940, we can do it again. To the sea! Go go go!"  
 GER_Endsieg:0 "Endsieg"
 GER_assistitalianinfra:0 "Adapt to the new battlefield."
 GER_Endsieg_desc:0 "Its a fight to the bitter end. Should have built the Arctic Base :("  
