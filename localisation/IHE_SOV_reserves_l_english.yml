l_english:
 ihe_sov_reserves.1.t:0 "RKKA Reserves Mobilised"
 ihe_sov_reserves.1.d:0 "With over 1.25 million men lost, the Stavka has released the first wave of reserve divisions from the Urals to the front."
 ihe_sov_reserves.1.a:0 "To the front!"
 ihe_sov_reserves.2.t:0 "Second Wave of RKKA Reserves"
 ihe_sov_reserves.2.d:0 "Losses have passed 2.5 million men. A second wave of reserve divisions is moving out of the Urals."
 ihe_sov_reserves.2.a:0 "Not one step back!"
 ihe_sov_reserves.3.t:0 "Final RKKA Reserves Committed"
 ihe_sov_reserves.3.d:0 "With 3.75 million men lost, the last of the strategic reserve is committed to the front, and NKVD blocking detachments march behind it."
 ihe_sov_reserves.3.a:0 "For the Motherland!"
