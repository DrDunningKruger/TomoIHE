l_english:
 ITA_autarky:0 "Autarky in the Mediterranean"
 ITA_autarky_desc:0 "Italy will be self-sufficient in the Mediterranean, and will not rely on foreign imports for its economic needs. By investing in domestic production and resource management, we will ensure that our nation can thrive even in times of global uncertainty."
 ITA_civilian_economy:0 "Civilian Economy"
 ITA_civilian_economy_desc:0 "Italy will focus on developing a strong civilian economy, prioritizing the needs of our citizens and businesses. By investing in infrastructure, education, and innovation, we will create a prosperous society that benefits all Italians."
 ITA_concentrated_resources:0 "Concentrated Resources"
 ITA_concentrated_resources_desc:0 "Italy will focus on concentrating its resources in key areas to maximize efficiency and productivity."
 ITA_resource_development:0 "Resource Development"
 ITA_resource_development_desc:0 "Italy will prioritize the development of its natural resources, investing in mining, agriculture, and energy production to ensure a stable and sustainable supply for our nation."
 ITA_streamlined_output:0 "Autarky Achieved"
 ITA_streamlined_output_desc:0 "Italy has achieved autarky, ensuring that our nation is self-sufficient and resilient in the face of global challenges."
 ITA_axis_focus:0 "Joint Axis Focus"
 ITA_axis_focus_desc:0 "Italy will work closely with its Axis partners to achieve common goals and strengthen our collective position on the world stage."
 ITA_develop_the_minors:0 "Develop the Minors"
 ITA_develop_the_minors_desc:0 "Italy will focus on developing its minor allies, they will be of upmost importance to our plans."
 ITA_develop_germany:0 "Develop Germany"
 ITA_develop_germany_desc:0 "Italy will focus on developing Germany, fascism is the future, we must ensure that our German brothers are strong"
 ITA_develop_the_military:0 "Develop the Italian Military"
 ITA_develop_the_military_desc:0 "Italy will focus on developing its military capabilities, investing in training, equipment, and strategic planning to ensure that our armed forces are prepared to defend our nation and its interests."
 ITA_bastion_africa:0 "Bastion of Africa"
 ITA_bastion_africa_desc:0 "A Strong Italian Bastion in Africa is required. We must protect the oil fields at all costs. The war depends on it."
 ITA_faction_unity:0 "A United Faction"
 ITA_faction_unity_desc:0 "Without supporting each other's interests, we cannot hope to achieve our own in this war."