 AFRICA_atlantic_wall_category:0 "Axis Extraction of Critical African Resources"
 AFRICA_dday_forts:0 "Axis Extraction of Critical African Resources: [?global.AFRICA_dday_forts]/10 Coastal Fort Levels Added"
 AFRICA_dday_forts_desc:0 "The Axis holds every zone in Africa (§YVictory in Africa§!). Each time this timer runs out, §Y1§! level of coastal fort is added to every coastal province of the D-Day coast (the French Atlantic coast, Benelux and the German North Sea coast), up to §Y10§!.\n\nIf the Allies retake a zone while the Axis is still ahead, this timer still finishes and builds its forts, but no new timer starts until the Axis holds every zone again. If Africa falls back to §YStalemate§! or the Allies' favour, the timer is cancelled at once. Construction stops for good on §Y1 January 1942§!.\n\nLevels added so far: §Y[?global.AFRICA_dday_forts]§!"
