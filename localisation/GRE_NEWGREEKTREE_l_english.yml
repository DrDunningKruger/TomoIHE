l_english: 
GRE_focus_on_the_haf:0 "Focus on the H.A.F"
GRE_focus_on_the_haf_desc:0 "The Hellenic Armed Forces have been neglected because of the economic troubles of the interwar yers. It is itme to update our doctrines and our equipment"
GRE_greek_general_staff:0 "Greek General Staff"
GRE_greek_general_staff_desc:0 "The Hellenic Genreral Staff has served us well in the balkan wars, WWI and the Greco-Turkish War. They are now called to do so again" 
GRE_tackle_the_italian_threat:0 "Tackle the Italian Threat"
GRE_tackle_the_italian_threat_desc:0 "Italian agression will be met with determination"
GRE_adopt_the_papagos_plan:0 "Adopt the Papàgos Plan"
GRE_adopt_the_papagos_plan_desc:0 "Adopt the defensive plans of the traditional, but clever Field Marshal Aléxandros Papàgos"
GRE_adopt_the_tsolakoglou_strategy:0 "Adopt the Tsolàkoglou Strategy"
GRE_adopt_the_tsolakoglou_strategy_desc:0 "Tsolàkoglou is a brilliant theorist that looks to modernise the Greek army and bring tanks into the fold"
GRE_upgrade_the_mannlicher_1903:0 "Upgrade the Mannlicher 1903"
GRE_upgrade_the_mannlicher_1903_desc:0 "Upgrade the Mannlicher 1903, it has served us well, but we have to move on"
GRE_superior_planning:0 "Superior Planning"
GRE_superior_planning_desc:0 "Aléxandros Papàgos believes that a good plan is how you win a war"
GRE_pack_artillery:0 "Cánon de 65 M Pack Artillery"
GRE_pack_artillery_desc:0 "It is time to equip our mountaineers"
GRE_anti_tank_warfare:0 "Anti Tank Warfare"
GRE_anti_tank_warfare_desc:0 "Modern Artillery is the key to a modern army"
GRE_motorization_of_the_army:0 "Motorization of the Army"
GRE_motorization_of_the_army_desc:0 "Mobility is Key"
GRE_hellenic_tank_program:0 "Hellenic Tank Program"
GRE_hellenic_tank_program_desc:0 "Development of tanks is the key to a modern army"
GRE_british_assistance_in_tank_development:0 "British Assistance in Tank Development"
GRE_british_assistance_in_tank_development_desc:0 "We have to modernize our tanks, the British will help"
GRE_epk_pyrkal_submachinegun:0 "E.P.K Pyrkal Submachinegun"
GRE_epk_pyrkal_submachinegun_desc:0 "Modernisation of our gun stockpile is in order"
GRE_artillery_modernization:0 "Artillery Modernization"
GRE_artillery_modernization_desc:0 "Modern artillery and AA is going to be needed in the near future"
GRE_mechanized_army:0 "Mechanized Army"
GRE_mechanized_army_desc:0 "Mechanised corps to reinforce our tank divisions"
GRE_defense_of_the_epirus:0 "Defence of the Epirus"
GRE_defense_of_the_epirus_desc:0 "We need a cohesive plan to defend ourselves in the case Italy invades through Albania"
GRE_defense_of_the_macedonia:0 "Defence of the Macedonia"
GRE_defense_of_the_macedonia_desc:0 "We need to prepare a plan to defend ourselves against a possible invasion through Bulgaria"
GRE_evzones:0 "Èvzones"
GRE_evzones_desc:0 "The Elites of the Greek Soldiers, any enemy that plans on invading will taste the boot of the Èvzone"
GRE_freedom_or_death:0 "Freedom or Death"
GRE_freedom_or_death_desc:0 "Freedom or Death! To our last breath! Onwards Brothers! For the Glory of Hellas!"
GRE_update_the_hraf:0 "Update the H.R.A.F"
GRE_update_the_hraf_desc:0 "Update the Hellenic Royal Air Force. We need to be able to control our own skies"
GRE_the_underdog_strategy:0 "The Underdog Strategy"
GRE_the_underdog_strategy_desc:0 "While we cannot hope to defeat the Regia Autonautica, we will give them a bloody nose"
GRE_establish_the_fighter_command:0 "Establish the Fighter Command"
GRE_establish_the_fighter_command_desc:0 "Our reliable Polish biplanes will be ready to respond to any provocation"
GRE_establish_the_bomber_command:0 "Establish the Bomber Command"
GRE_establish_the_bomber_command_desc:0 "What is an air force without bombers?"
GRE_airfield_construction:0 "Construct the Ellinikó Airport"
GRE_airfield_construction_desc:0 "Construct the Ellinikó Airport to upgrade the Athenian air connections"
GRE_fund_the_hrn:0 "Fund the H.R.N"
GRE_fund_the_hrn_desc:0 "Fund the Hellenic Royal Navy"
GRE_the_greek_merchant_marine:0 "The Greek Merchant Marine"
GRE_the_greek_merchant_marine_desc:0 "Our Merchant Marine is unmatched by anyone in the Agean"
GRE_mega_to_tis_thakassis_kratos:0 "Méga to tis thalássis Krátos"
GRE_mega_to_tis_thakassis_kratos_desc:0 "The great Maritime state, Greece has expirience in its own seas"
GRE_hit_and_run_tactics:0 "Hit and Run Tactics"
GRE_hit_and_run_tactics_desc:0 "We might not be able to defeat the Regia Marina, but we will give them headaches"
GRE_upgrade_the_averof:0 "Upgrade the Averof"
GRE_upgrade_the_averof_desc:0 "Upgrade the Averof Armoured Cruiser, the great jewel of the Hellenic Royal Navy"
GRE_aetos_class_destroyers:0 "Aetos Class Destroyers"
GRE_aetos_class_destroyers_desc:0 "Destroyer upgrades are in order, we have to protect ourselves"
GRE_modern_battleships:0 "Modern Battleships"
GRE_modern_battleships_desc:0 "Modern Battleship, to be pride and flagship of our fleet!"
GRE_cult_of_the_admiral:0 "Cult of the Admiral"
GRE_cult_of_the_admiral_desc:0 "Pávlos Koundouriótis was the rockstar Greek admiral of the Georgios Averof during the Balkan Wars. This admiral's dedication to the Hellenic Royal Navy is a constant inspiration to our Navy and to the Greek ship builders, we are to rule the Agean Sea!"
GRE_revive_the_eleusina_shipyard:0 "Revive the Eleusína Dockyard"
GRE_revive_the_eleusina_shipyard_desc:0 "The Eleusína Docks will have to get buisy again"
GRE_civil_engineering_plans:0 "Civil Engineering Plans"
GRE_civil_engineering_plans_desc:0 "Our national industries and infrastructure are about to undergo a major transformation, we have to be prepared"
GRE_public_works_projects:0 "Public Works Projects"
GRE_public_works_projects_desc:0 "Construction always fed the poor in Greece, and it shall do so again"
GRE_athens_salonica_railway:0 "Athens Salonica Railway"
GRE_athens_salonica_railway_desc:0 "Connect our two major cities with a new railway"
GRE_pyrkal_deal:0 "Pyrkal Deal"
GRE_pyrkal_deal_desc:0 "Make a deal with the E.P.K Pyrkal Arms manufacturer"
GRE_create_elbo:0 "Create ELBO"
GRE_create_elbo_desc:0 "Create the Hellenic State Arms Manufacturer"
GRE_firearm_factories:0 "Firearm Factories"
GRE_firearm_factories_desc:0 "Small Arms Factories are the key to equip the Greek Army"
GRE_national_labor_service:0 "National Labor Service"
GRE_national_labor_service_desc:0 "Establish the National Labour Service, we can give work to all poor without communist unions"
GRE_state_corporatism:0 "State Corporatism"
GRE_state_corporatism_desc:0 "State Corporations will be the catalyst to our progress"
GRE_new_construction_safety_standards:0 "New Construction Safety Standards"
GRE_new_construction_safety_standards_desc:0 "New Construction Safety Standards are the key to productivity"
GRE_end_the_ifesi:0 "End the Ifesi"
GRE_end_the_ifesi_desc:0 "The depression will limit Greek buisness no more!"
GRE_tobacco_exports:0 "Tobacco Exports"
GRE_tobacco_exports_desc:0 "Greek Tobacco Exports will bring in new capital"
GRE_fund_the_athens_polytechnic_university:0 "Fund The Athens Polytechnic University"
GRE_fund_the_athens_polytechnic_university_desc:0 "The Athens Polytechnic University has a pedigree of great research, we must support them"
GRE_state_employment:0 "State Employment"
GRE_state_employment_desc:0 "Metaxás Plans to feed the poor, he things state employment will help"
GRE_build_the_metaxas_line:0 "Build the Metaxàs Line"
GRE_build_the_metaxas_line_desc:0 "Build the Metaxàs Line to defend thrace and Macedonia from Bulgaria"
GRE_extend_the_metaxas_line:0 "Extend the Metaxàs Line"
GRE_extend_the_metaxas_line_desc:0 "Extend the Metaxàs Line to cover the Epirus Sector"
GRE_navigate_the_political_crisis:0 "Navigate the Political Crisis"
GRE_navigate_the_political_crisis_desc:0 "A power struggle between the nationalists, republicans and communists is underway, the volotile political situation requires attention from the King"
GRE_appoint_metaxas_as_defence_minister:0 "Appoint Metaxàs as Defence Minister"
GRE_appoint_metaxas_as_defence_minister_desc:0 "The old general will act as a powerful mediator and hopefully take control of the situation" 
GRE_4th_of_august_regime:0 "4th of August Regime"
GRE_asfalia:0 "Asfalia"
GRE_asfalia_desc:0 "The Fearsome secret police of the Metaxá Reigime, better keep quiet, even the walls have ears"
GRE_public_reeducation:0 "Public Re-education"
GRE_public_reeducation_desc:0 "Public Re-education of our poeple. We will teach the ideals of the 4th of August Regime"
GRE_establish_eon:0 "Establish E.O.N"
GRE_establish_eon_desc:0 "We have established the National Youth Organisation, this organisation will serve to educate our children and teens about the values of Metaxas and the 4th of August Reigime. These youths will make great workers and if need be, soldiers"
GRE_imprison_the_communists:0 "Imprison the Communists"
GRE_imprison_the_communists_desc:0 ""
GRE_yre_broadcasting:0 "YRE Broadcasting"
GRE_yre_broadcasting_desc:0 "YRE Broadcasts support out king, they also teach us lessons about ellectronic engineering"
GRE_strenghten_the_crown:0 "Strenghten the Crown"
GRE_strenghten_the_crown_desc:0 "Strengthen The Crown, is strengthening the country"
GRE_prohibit_strikes:0 "Prohibit Strikes"
GRE_prohibit_strikes_desc:0 "The Regime will take care of workers, strikes are not needed" 
GRE_create_the_ika:0 "Create the I.K.A"
GRE_create_the_ika_desc:0 "The National Insurance Organisation to support our workers"
GRE_labour_protections:0 "Labour Protections"
GRE_labour_protections_desc:0 "Labour Protections are needed to protect our workers"
GRE_social_security:0 "Social Security"
GRE_social_security_desc:0 "Social Security is the work of the I.K.A, these programms are proving popular"
GRE_third_hellenic_civilization:0 "Third Hellenic Civilization"
GRE_third_hellenic_civilization_desc:0 "Third Hellenic Civilisation, the Vision of Metaxas is Complete!"
GRE_debt_relief:0 "Debt Relief"
GRE_debt_relief_desc:0 "Debt relief will help the struggling families and peasants of Greece"
GRE_oxi:0 "OXI"
GRE_oxi_desc:0 "NO! we shall not let the Italians move in to our country without a fight, 'OXI' was the answer to the Italian ultimatum. If worse comes to worst and we lose our mainland, Crete is were we make our last stand"
GRE_aera:0 "AERA"
GRE_aera_desc:0 "Brothers! Fix bayonets! Dia tis Lónghis! AERA!"
GRE_british_arms_assistance:0 "British Arms Assistance"
GRE_british_arms_assistance_desc:0 "The British will hopefully help us aleviate the problems we are expiriencing with ammunition sortages"
GRE_evacuate_government_to_crete:0 "Evacuate Government to Crete"
GRE_evacuate_government_to_crete_desc:0 "The mainland can no longer be held, we have been defeated by technologically and numerically superior Axis forces. Evacuate the remnants of our army and the government to Heraklion. We will make our last stand in Crete!"
GRE_5th_cretan_division:0 "5th Cretan Division"
GRE_5th_cretan_division_desc:0 "Crete needs an effective Greek Defence Force"
GRE_greek_partisans:0 "Greek Partisans"
GRE_greek_partisans_desc:0 "Greek Guerillas, the self proclamed Antártes, will cooperate with the British in order to sabotage the occupiers. The Axis soldiers opressing the Greek civilians better sleep with one eye open..."
GRE_polemos:0 "O Polemos mas sinehizetai!"
GRE_polemos_desc:0 "An exerpt from the last message of the Athens Radio Station: 'Greeks, hold your spirits high. Our war goes on! And it will go on, until our final victory. Long Live the Nation of the Greeks!"
GRE_british_soe:0 "British S.O.E"
GRE_british_soe_desc:0 "The British S.O.E will support the Greek partisans and help them organise"
GRE_assist_the_eam:0 "Assist the EAM"
GRE_assist_the_eam_desc:0 "The Greek Communist party has, independently of the government, waged a very effective guerilla war through its armed wing, the National Liberation Front, the EAM!"
GRE_fund_the_edes:0 "Fund the EDES"
GRE_fund_the_edes_desc:0 "Former republican General Napoleon Zervas is leading a resistance organisation, we should support him"
GRE_grogopotamos_bridge_sabotage:0 "Grogopotamos Bridge Sabotage"
GRE_grogopotamos_bridge_sabotage_desc:0 "Its time to blow that bridge to kingdom come"
GRE_establish_the_cairo_government:0 "Establish the Cairo Government"
GRE_establish_the_cairo_government_desc:0 "Our country has been defeated. The Greek Government, along with some soldiers and refugees has reached alexandria and established itself in Cairo. With British help, we will continue the struggle, until final Victory. Méhri tis Telikís Níkis!, long live Hellas!"
GRE_the_haf_in_the_middle_east:0 "The H.A.F in the Middle East"
GRE_the_haf_in_the_middle_east_desc:0 "Establish The Hellenic Armed Forces in the Middle East in order to continue the struggle from exile. All free Greeks are called to serve!"
GRE_deal_with_mutinies:0 "Deal With Mutinies"
GRE_deal_with_mutinies_desc:0 "Arrest these troublemakers, we can't afford insubordination in this trying time"
GRE_3rd_mountain_brigade:0 "3rd Mountain Brigade"
GRE_3rd_mountain_brigade_desc:0 "New Politically reliable soldiers will carry us to victory"
GRE_take_the_fight_to_italy:0 "Take the Fight to Italy"
GRE_take_the_fight_to_italy_desc:0 "We shall land with American Help and crush the Italian menace"
GRE_efoplisters:0 "Efoplisters"
GRE_efoplisters_desc:0 "The rich Greek shipping magnates 'Efoplistes' are helping our country with donations in these hard times"
GRE_indian_ocean_patrols:0 "Indian Ocean Patrols"
GRE_indian_ocean_patrols_desc:0 "If we can't keep up with the British navy in the Mediterranian, we will help in the Indian Ocean"
